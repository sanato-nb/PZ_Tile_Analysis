      - name: Scan all original TMX and preserve physical DB
        run: python3 -u scripts/v124_scan_d_new4472.py
      - name: Independent CSV, SHA, SQLite and parent table audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,csv,sqlite3,zlib,base64
          R=Path('.')
          m=json.loads((R/'review/v124_D_locations_new4472/MANIFEST.json').read_text())
          d=json.loads((R/'analysis/current/v124/MANIFEST.json').read_text())
          p=R/m['csv_path']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['csv_sha256']
          with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==4472 and len({(r['tile_set_name'],r['local_id']) for r in rows})==4472
          assert [int(rows[0]['index']),int(rows[-1]['index'])]==[160,4631]
          assert sum(r['d_status']=='actual_second_placement' for r in rows)==m['D_actual_second_placement']
          assert sum(r['d_status']=='no_second_placement' for r in rows)==m['D_no_second_placement']
          assert all(r['D_image_generated']=='0' and r['final_certified']=='0' for r in rows)
          b=base64.b64decode(''.join((R/path).read_text() for path in d['parts']))
          assert hashlib.sha256(b).hexdigest()==d['compressed_sha256']
          raw=zlib.decompress(b)
          assert hashlib.sha256(raw).hexdigest()==d['sqlite_sha256']
          z=Path('/tmp/independent_v124.sqlite');z.write_bytes(raw)
          with sqlite3.connect(z) as c:
            assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert c.execute('SELECT count(*) FROM v124_d_placement_4472').fetchone()[0]==4472
            assert c.execute('SELECT count(*) FROM v123_abcd_evidence_next160').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM v122_ai_visual_review_160').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM v121_abcd_evidence').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM tile_catalog').fetchone()[0]==5409
            assert c.execute('SELECT count(*) FROM tile_catalog WHERE observed_any=1').fetchone()[0]==5400
            assert c.execute('SELECT count(*) FROM v116_user_excluded_missing_image').fetchone()[0]==6
            assert c.execute('SELECT count(*) FROM v113_user_review').fetchone()[0]>=9
          print('PASS independent v124 audit')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v124-D-index-4472-verified
          path: |
            review/v124_D_locations_new4472/
            analysis/current/v124/
          retention-days: 90
          compression-level: 0
      - name: Commit new evidence without altering prior sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v124_D_locations_new4472/ analysis/current/v124/
          if ! git diff --cached --quiet; then
            git commit -m "v124: index actual D placements for remaining 4472 and preserve v123 SQLite"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
