name: "v66 타일 분석 통합 SQLite 복원·중복·증거 무결성 검증"
on:
  push:
    branches:
      - work/v66-visual-20261026
    paths:
      - scripts/build_unified_v66.py
      - scripts/restore_unified_v66.py
      - checkpoints/v66/observations.tsv
      - .github/workflows/build-unified-v66.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 검증할 원본 DB와 신규 관찰 기록 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analysis/current/v65/*
            /scripts/*.py
            /checkpoints/v66/*
            /checkpoints/v66_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v66.yml
      - name: v65 원본 8천만 바이트 SQLite SHA-256 및 무결성 검사
        run: python3 scripts/restore_unified_v65.py "$RUNNER_TEMP/v65.sqlite"
      - name: v66 A/B/C/D 225개 이미지와 45개 고유 키 검증
        run: python3 checkpoints/v66/verify_delta.py
      - name: 원본 테이블 보존한 통합 SQLite 생성
        run: python3 scripts/build_unified_v66.py "$RUNNER_TEMP/v65.sqlite"
      - name: 전체 복원 왕복 SHA-256·SQLite·중복·수량 검증
        run: python3 scripts/restore_unified_v66.py "$RUNNER_TEMP/v66_roundtrip.sqlite"
      - name: 프로젝트 상태 검사 및 인수인계 자동 갱신
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - name: 전체 v66 SQLite 액션 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-unified-v66-SQLite
          path: ${{ runner.temp }}/tile_visual_v66_unified.sqlite
          retention-days: 90
          if-no-files-found: error
      - name: v66 검증 완료 데이터·체크포인트 갱신
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v66/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "데이터: v66 신규 45종 통합 DB와 검증 인수인계 저장"
            git push
          fi
