name: v93 5-tile visual review unified SQLite verification
on:
  push:
    branches: [work/v93-evidence-20261026-1300]
    paths:
      - scripts/build_unified_v93.py
      - scripts/restore_unified_v93.py
      - scripts/build_v93_review_html.py
      - checkpoints/v93/observations.tsv
      - checkpoints/v93/verify_delta.py
      - .github/workflows/build-unified-v93.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v92/*
            /scripts/*.py
            /checkpoints/v93/*
            /checkpoints/v93_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v93.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Restore and verify v92 source database
        run: python3 scripts/restore_unified_v92.py "$RUNNER_TEMP/v92.sqlite"
      - name: Validate 5 unique independently inspected tiles and original PNG/TMX evidence
        run: python3 checkpoints/v93/verify_delta.py
      - name: Build v93 unified database preserving all original tables
        run: python3 scripts/build_unified_v93.py "$RUNNER_TEMP/v92.sqlite"
      - name: Restore v93 compressed SQLite and verify counts
        run: python3 scripts/restore_unified_v93.py "$RUNNER_TEMP/v93_roundtrip.sqlite"
      - name: Produce CSV, embedded HTML and CRC ZIP
        run: python3 scripts/build_v93_review_html.py
      - name: Validate project and refresh handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v93-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v93_unified.sqlite
          retention-days: 90
      - name: Commit verified v93 database and checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v93/ checkpoints/v93/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증: v93 신규 5종 직접 판독 SQLite SHA·중복·CRC 및 기존 계보 보존"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
