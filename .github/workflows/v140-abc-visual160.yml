      - run: python3 -m pip install --quiet Pillow
      - name: Physically inspect source image and map pixels, preserve prior SQLite
        run: python3 -u scripts/v140_abc_visual160.py
      - name: Independent CRC, SHA, parent table and row-count verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,base64,zlib,sqlite3,csv
          R=Path('review/v140_abc_880_1039')
          m=json.loads((R/'MANIFEST.json').read_text())
          d=json.loads(Path('analysis/current/v140/MANIFEST.json').read_text())
          p=json.loads(Path('analysis/current/v139/MANIFEST.json').read_text())
          assert m['manual_image_annotations']==160
          assert m['promoted_provisional']+m['excluded_unverified']==160
          assert m['promoted_provisional']>=75
          assert d['new_rows']==m['promoted_provisional']
          assert d['parent_sqlite_sha256']==p['sqlite_sha256']
          assert d['table_count']==202 and d['prior_tables_preserved']==201
          assert m['mapping_verified']==m['tilezed_verified']==m['certified']==0
          for name,h in m['files_sha256'].items():
           assert hashlib.sha256((R/name).read_bytes()).hexdigest()==h,name
          with zipfile.ZipFile(R/'ABC_EVIDENCE_VERIFIED.zip') as f:
           assert f.testzip() is None and len(f.namelist())==4*m['promoted_provisional']
          with (R/'VISUAL_REVIEW.csv').open(encoding='utf-8-sig') as f:
           rows=list(csv.DictReader(f))
          assert len(rows)==m['promoted_provisional']
          assert len({(r['tile_set_name'],r['local_id']) for r in rows})==len(rows)
          assert all(r['visual_status']=='provisional_candidate' and r['certified']==r['mapping_verified']==r['tilezed_verified']=='0' for r in rows)
          packed=base64.b64decode(''.join(Path(part).read_text('ascii').strip() for part in d['parts']),validate=True)
          assert hashlib.sha256(packed).hexdigest()==d['compressed_sha256']
          raw=zlib.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()==d['sqlite_sha256'] and len(raw)==d['sqlite_bytes']
          db=sqlite3.connect(':memory:');db.deserialize(raw)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]==202
          assert db.execute('SELECT count(*) FROM tile_catalog').fetchone()[0]==5409
          assert db.execute('SELECT count(*) FROM v139_visual_review').fetchone()[0]==149
          assert db.execute('SELECT count(*) FROM v140_visual_review').fetchone()[0]==m['promoted_provisional']
          assert db.execute('SELECT count(*) FROM v140_visual_review WHERE certified!=0 OR mapping_verified!=0 OR tilezed_verified!=0').fetchone()[0]==0
          print('PASS v140',len(rows),'provisional new observations and physical SQLite SHA',d['sqlite_sha256'])
          PY
      - name: Commit new evidence to isolated branch (never rewrite main or parent)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v140_abc_880_1039 analysis/current/v140
          if ! git diff --cached --quiet; then
            git commit -m "v140: new A B C visual observations and append-only physical DB"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
