name: Verify eight better PZ furniture replacement models using native Blockbench
on:
  push:
    branches: [work/rosewood-blockbench-357-rematch-20261101]
    paths: [.github/workflows/rosewood-better-8-native.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replacement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/native_blockbench_render_better_replacements.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_real_furniture_matches_v4/ROSEWOOD_357_PZ_TO_REAL_MINECRAFT_BLOCKSTATE_MATCH.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
      - name: Verified official Blockbench desktop
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo "375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage" | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install native gui automation
        run: |
          python3 -m pip install -q --break-system-packages pillow playwright numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Verify better model candidates against complete original PZ PNG
        run: |
          python3 -u scripts/native_blockbench_render_better_replacements.py
      - name: Validate visual provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("analysis/rosewood_furniture/2026-10-31/blockbench_native_replacement_candidates_v1")
          a=json.loads((p/"NATIVE_BLOCKBENCH_PROOF.json").read_text("utf8"))
          assert len(a)==8
          good=[x for x in a if x.get("loaded_verified")]
          assert len(good)>=6,len(good)
          assert len(list(p.glob("*_PZ_VS_NEW_MC_CANDIDATE.jpg")))>=6
          print("NEW_NATIVE_CANDIDATES",len(good),"/",len(a))
          PY
      - name: Commit new comparison pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/blockbench_native_replacement_candidates_v1/
          git commit -m "evidence(rosewood): eight stronger Minecraft furniture replacement candidates rendered in real Blockbench"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
