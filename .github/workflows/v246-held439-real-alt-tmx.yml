name: v246 439 held keys - real alternative TMX locations
on:
  push:
    branches: [review/v246_held439_real_alt_TMX_20261030]
    paths:
      - scripts/v246_scan_held439_all84_actual_TMX.py
      - .github/workflows/v246-held439-real-alt-tmx.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan_real_TMX_sites:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v246_scan_held439_all84_actual_TMX.py
            /review/v117_A_candidates_10042/MANIFEST.json
            /review/v238_integrated_master_2026-10-29/*
            /review/v246_held439_real_alt_TMX_2026-10-30/*
      - name: Fetch precisely 84 known genuine TMXs by verified v117 manifest
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('review/v117_A_candidates_10042/MANIFEST.json'))
          with open('/tmp/selected_sparse.txt','w') as f:
              for p in ['/scripts/v246_scan_held439_all84_actual_TMX.py','/review/v117_A_candidates_10042/MANIFEST.json','/review/v238_integrated_master_2026-10-29/*','/review/v246_held439_real_alt_TMX_2026-10-30/*']:
                  f.write(p+'\n')
              for x in m['source_tmx']:f.write('/B4220.3_MapExport_256/tmx/'+x['tmx']+'\n')
          print('84 TMXs from original manifest')
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/selected_sparse.txt
      - name: Verify source SHA and scan all actual TMX occurrences
        run: python3 -u scripts/v246_scan_held439_all84_actual_TMX.py
      - name: Save audit only; do not modify previous master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v246_held439_real_alt_TMX_2026-10-30/
          if ! git diff --cached --quiet; then
            git commit -m "v246: scan 84 source TMX alternate locations for every held tile"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
