name: v119 choose and validate new-only 4632 representative A images
on:
  push:
    branches: [work/v119-selected-A-new4633-20261026]
    paths:
      - scripts/v119_select_A_4632.py
      - .github/workflows/v119-selected-a-4632.yml
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v119_select_A_4632.py
            /review/v118_A_new_only_4633/A_CANDIDATE_NEW_ONLY_4633.csv
            /review/v118_A_new_only_4633/SUMMARY.json
            /review/v117_A_candidates_10042/jumbo_a3/A3_CANDIDATES.csv
            /review/v119_selected_A_new4633/*
            /Tiles/*
      - name: Install image dependencies
        run: python3 -m pip install --quiet pillow
      - name: Assign one pixel-identical representative per visible A key
        run: python3 -u scripts/v119_select_A_4632.py
      - name: Verify actual selected crop bytes and indexed PNG ZIP shards
        run: |
          python3 - <<'PY'
          import pathlib,json,csv,hashlib,io,zipfile
          from PIL import Image
          R=pathlib.Path('review/v119_selected_A_new4633')
          m=json.loads((R/'MANIFEST.json').read_text('utf8'))
          with (R/'REPRESENTATIVE_A_4633.csv').open(encoding='utf-8-sig',newline='') as f:a=list(csv.DictReader(f))
          assert len(a)==4633
          assert len({(x['tile_set_name'],x['local_id']) for x in a})==4633
          assert (m['representative_A_selected'],m['held_missing_source'])==(4632,1)
          assert (m['selected_A1_consistent'],m['selected_A2'],m['selected_A3'])==(1544,3068,20)
          assert sum(x['selection_status']=='held_missing_source' for x in a)==1
          assert all(x['local_id_mapping_verified']==x['tilezed_verified']==x['ai_independently_verified']==x['final_identity_certified']=='0' for x in a)
          assert m['existing_reused_excluded_from_new_assignment']==5409
          assert m['selected_contact_sheet_count']==58
          assert len(list((R/'sheets').glob('SELECTED_A_*.jpg')))==58
          for p in (R/'sheets').glob('SELECTED_A_*.jpg'):
            with Image.open(p) as im:
              assert im.size==(1920,1650);im.verify()
          actual={}
          for s in m['png_archive_shards']:
            path=pathlib.Path(s['path'])
            assert hashlib.sha256(path.read_bytes()).hexdigest()==s['sha256']
            with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert len(z.namelist())==s['entries']
              actual.update({(str(path.relative_to(R)),name):z.read(name) for name in z.namelist()})
          assert len(actual)==4632
          for x in a:
            if x['selection_status']=='held_missing_source':continue
            k=(x['selected_shard'],x['selected_zip_entry'])
            raw=actual[k]
            assert hashlib.sha256(raw).hexdigest()==x['selected_png_file_sha256']
            with Image.open(io.BytesIO(raw)) as im:
              assert im.mode=='RGBA'
              assert hashlib.sha256(im.tobytes()).hexdigest()==x['selected_rgba_pixel_sha256']
              assert sum(im.getchannel('A').histogram()[1:])==int(x['selected_alpha_pixels'])
          assert hashlib.sha256((R/'REPRESENTATIVE_A_4633.csv').read_bytes()).hexdigest()==m['selected_ledger_sha256']
          print('PASS 4632 source-pixel-verified RGBA representatives, 1 held, 58 sheets, all ZIP CRC, prior 5409 excluded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v119-representative-A-4632-selected
          path: review/v119_selected_A_new4633/
          compression-level: 0
          retention-days: 90
      - name: Commit all source-identical A sprites, ledger, and review sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v119_selected_A_new4633/
          if ! git diff --cached --quiet; then
            git commit -m "v119: 4632 actual selected A RGBA crops, one source held, full per-pixel SHA and ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
