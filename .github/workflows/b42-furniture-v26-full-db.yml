name: B42 v26 full furniture source-first grid direct visual database
on:
  push:
    branches:
      - work/pz-b42-all-remaining-multitile-visual-v26-20261105
    paths:
      - scripts/build_b42_furniture_source_grid_v26.py
      - analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_235_DIRECT_VISUAL_GROUP_SHAPE_OBSERVATIONS.csv
      - .github/workflows/b42-furniture-v26-full-db.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v25/B42_FURNITURE_CROSS_FACING_REVIEW_V25.zip
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/STAGING_MANIFEST.json
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_235_SOURCE_FACING_TO_VISUALLY_REVIEW.csv
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_ALL_RAW_SOURCE_PARTS_POSITION_AND_ATLAS_MAP.csv
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_ALL_NEW_SPRITE_PIXEL_SHA256.csv
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_235_DIRECT_VISUAL_GROUP_SHAPE_OBSERVATIONS.csv
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_ORIGINAL_MULTITILE_SOURCE_CONTACT_01.png
            /analysis/furniture_full_b42/2026-11-05/all_multitile_visual_v26/V26_ORIGINAL_MULTITILE_SOURCE_CONTACT_02.png
