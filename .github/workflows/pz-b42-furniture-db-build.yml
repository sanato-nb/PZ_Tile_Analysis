name: Build entire Project Zomboid B42 source-preserving furniture database
on:
  push:
    branches: [work/pz-b42-full-furniture-database-20261103]
    paths:
      - .github/workflows/pz-b42-furniture-db-build.yml
      - scripts/build_full_b42_furniture_db.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analysis/current/v259/PZ_v259_all_png_tile_definitions.sqlite
            /pzwiki_furniture/2026-11-03/furniture_1268.csv
            /analysis/rosewood_furniture/2026-10-31/furniture_identity_catalog_20261103/SOURCE_SPRITES_1347.csv
            /analysis/rosewood_furniture/2026-10-31/furniture_identity_catalog_20261103/CATALOG_357_STYLES.csv
            /scripts/build_full_b42_furniture_db.py
      - name: Create furniture DB without modifying originals
        run: |
          python3 -m py_compile scripts/build_full_b42_furniture_db.py
          python3 -u scripts/build_full_b42_furniture_db.py
      - name: Validate source preservation and no invented items
        run: |
          python3 - <<'PY'
          import sqlite3, json, zipfile, csv
          from pathlib import Path
          root=Path('analysis/furniture_full_b42/2026-11-03')
          m=json.loads((root/'MANIFEST.json').read_text('utf8'))
          assert m['full_source_distinct_tiles']==61418
          assert m['wiki_rows']==1268
          assert m['full_source_original_rows']['source_slots']==73644
          assert m['full_source_original_rows']['source_attributes']==195265
          assert m['no_original_files_modified']
          PY
      - name: Commit report and self-contained compressed DB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/furniture_full_b42/2026-11-03/*.csv
          git add --sparse analysis/furniture_full_b42/2026-11-03/README_KO.md
          git add --sparse analysis/furniture_full_b42/2026-11-03/MANIFEST.json
          git add --sparse analysis/furniture_full_b42/2026-11-03/PZ_B42_FULL_FURNITURE_DB.zip
          git commit -m 'db(furniture): preserve all 61418 original B42 keys with full source attribute tables and Wiki 1268 furniture crosswalk'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
