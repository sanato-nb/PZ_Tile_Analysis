name: README 최신 상태 및 물리 DB 복원 검증
on:
  push:
    branches: [docs/sync-readme-v146-20261027]
  pull_request:
    paths:
      - README.md
      - scripts/generate_handoff.py
      - scripts/restore_latest_unified.py
      - .github/workflows/sync-handoff.yml
      - .github/workflows/docs-readme-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PROJECT_STATE.json
            /README.md
            /AGENTS.md
            /docs/HANDOFF.md
            /scripts/generate_handoff.py
            /scripts/validate_project.py
            /scripts/restore_latest_unified.py
            /analysis/current/v146/*
            /.github/workflows/docs-readme-check.yml
      - name: Python syntax + canonical state validation
        run: |
          python3 -m py_compile scripts/generate_handoff.py scripts/validate_project.py scripts/restore_latest_unified.py
          python3 scripts/validate_project.py
      - name: README summary stays in sync and reflects corrected D
        run: |
          python3 - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from generate_handoff import render_readme, README_START, README_END
          state=json.loads(Path('PROJECT_STATE.json').read_text())
          cp=state['latest_checkpoint']; db=state['unified_database']
          assert cp['version']=='v146' and db['version']=='v146'
          assert cp['expanded_unique_observed']==7209 and cp['expanded_unique_unobserved']==2833
          assert db['table_count']==208 and cp['mapping_verified']==cp['tilezed_verified']==cp['approved_final_certifications']==0
          readme=Path('README.md').read_text()
          assert readme.count(README_START)==readme.count(README_END)==1
          _, rest=readme.split(README_START,1)
          old, _=rest.split(README_END,1)
          assert (README_START+old+README_END)==render_readme(state)
          assert '동일 `(tile_set_name, local_id)`' in readme
          assert '동일한 TMX 위치' not in readme or '다른 사용 위치' in readme
          assert 'v80 당시 기록' in readme
          assert '## 1. 현재 작업 상태' in readme
          print('PASS README v146 summary and D definition')
          PY
      - name: Full v146 physical SQLite restore, SHA and integrity test
        run: |
          python3 scripts/restore_latest_unified.py /tmp/pz_latest_v146.sqlite
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect('/tmp/pz_latest_v146.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]==208
          assert db.execute('SELECT count(*) FROM v146_visual_review').fetchone()[0]==155
          print('PASS latest SQLite v146 fully restored',Path('/tmp/pz_latest_v146.sqlite').stat().st_size)
          PY
          if python3 scripts/restore_latest_unified.py /tmp/pz_latest_v146.sqlite; then
            echo 'FAIL: accidentally overwrote existing database'
            exit 1
          else
            echo 'PASS existing output overwritten: NO'
          fi
