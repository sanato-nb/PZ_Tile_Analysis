name: Rosewood first ten furniture - inspect twelve more actual mod models
on:
  push:
    branches: [work/rosewood-manual-10-batches-20261101]
    paths: [.github/workflows/rosewood-10-batch01-models.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/render_rosewood_batch01_extra_models.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_real_furniture_matches_v4/ROSEWOOD_357_PZ_TO_REAL_MINECRAFT_BLOCKSTATE_MATCH.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
      - name: Get official native Blockbench verified version
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo '375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage' | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install screenshot tools
        run: |
          python3 -m pip install -q --break-system-packages pillow playwright numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Render 12 source-backed furniture models directly with Blockbench
        run: python3 -u scripts/render_rosewood_batch01_extra_models.py
      - name: Count authentic renders and check original model source SHA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("analysis/rosewood_furniture/2026-10-31/ten_batch_review/01_001_010/extra_decocraft_render")
          d=json.loads((p/"NATIVE_BLOCKBENCH_PROOF.json").read_text("utf8"))
          assert len(d)==12,len(d)
          ok=[x for x in d if x.get("loaded_verified")]
          assert len(ok)>=10,len(ok)
          assert all((p/x["native_model_screenshot"]).exists() and len(x["source_sha256"])==64 for x in ok)
          print("REAL_SOURCE_MODELS",len(ok),"/12")
          PY
      - name: Store original-source actual Blockbench screenshot evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/rosewood_furniture/2026-10-31/ten_batch_review/01_001_010/extra_decocraft_render/
          git commit -m 'render(rosewood): actual Blockbench screenshots for batch 001-010 second-look furniture candidates'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
