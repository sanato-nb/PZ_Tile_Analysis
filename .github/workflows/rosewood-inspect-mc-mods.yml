name: Inspect actual Minecraft 1.20.1 Forge furniture mod assets
on:
  push:
    branches:
      - work/rosewood-mc-real-model-matching-20261101
    paths:
      - .github/workflows/rosewood-inspect-mc-mods.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/inspect_mc_furniture_mod_jars.py
      - name: Fetch officially published version JARs temporarily and catalog actual assets
        run: |
          python3 -m py_compile scripts/inspect_mc_furniture_mod_jars.py
          python3 -u scripts/inspect_mc_furniture_mod_jars.py
      - name: Validate source registry and no distributed JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,csv
          p=Path("analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2")
          x=json.loads((p/"MANIFEST.json").read_text("utf8"))
          assert x["mods_jar_inspected"]>=3,(x["mods_jar_inspected"],(p/"ERRORS.csv").read_text("utf8")[:800])
          with (p/"REAL_MOD_ASSET_CANDIDATES.csv").open(encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          assert rows
          assert len(rows)==x["blockstate_json_entries"]+x["language_only_not_registered_entries"]
          assert not list(p.glob("*.jar"))
          print("PASS MOD JAR METADATA",x["mods_jar_inspected"],"assets",len(rows))
          PY
      - name: Save actual verified model ID evidence on isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/
          if ! git diff --cached --quiet; then
            git commit -m "data(rosewood): actual Forge 1.20.1 mod JAR asset IDs and SHA provenance"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
