name: v193 build offline manual reviewer 33 unresolved source tile keys
on:
  push:
    branches: [work/v193-manual33-offline-review-kit-20261028]
    paths:
      - scripts/v193_build_manual33_offline.py
      - .github/workflows/v193-manual33-offline.yml
permissions:
  contents: write
concurrency:
  group: v193-manual33-offline-reviewer
  cancel-in-progress: true
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v193_build_manual33_offline.py
            /review/v192_image_first_TMX_BC_142/CROSSCHECK_142.csv
            /review/v192_image_first_TMX_BC_142/MANIFEST.json
            /review/v191_reopen142_A_first/MANUAL_A_IMAGE_OBSERVATIONS_142.json
            /review/v182_occlusion202/SOURCE_OCCLUSION_202.csv
            /review/v182_occlusion202/MANIFEST.json
            /review/v182_occlusion202/OCCLUSION_PROOF.part000.bin
            /review/v182_occlusion202/OCCLUSION_PROOF.part001.bin
            /review/v182_occlusion202/OCCLUSION_PROOF.part002.bin
            /review/v175_remaining381_evidence_audit/OLD_NINE_UNOBSERVED.json
      - name: Install PIL for original A and actual source B/C proof images
        run: python3 -m pip install --quiet Pillow
      - name: Assemble standalone HTML with embedded original A, true B and C proof images plus blank manual review fields
        run: python3 -u scripts/v193_build_manual33_offline.py
      - name: Independently check all 33 keys, 23 source-backed and 10 without A, package ZIP CRC and no fake auto certification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,json,re,zipfile
          p=Path('review/v193_manual33_offline_review')
          m=json.loads((p/'MANIFEST.json').read_text())
          assert m['actual_key_count']==33 and m['verified_A_and_real_B_C']==23 and m['no_exact_A_or_scene']==10
          assert m['number_already_certified']==m['number_auto_promoted']==0
          assert m['prior_reviewed_observed']==10007 and m['prior_remaining_checkpoint']==35
          assert m['unresolved_count_gap_not_keys']==2
          html=p/m['html_file'];a=html.read_text(encoding='utf-8')
          assert hashlib.sha256(html.read_bytes()).hexdigest()==m['html_sha256']
          assert "source-data" in a and "PZ_manual33_review_v193" in a
          assert "B · 실제 TMX 원래 장면" in a and "C · 대상 GID 하나 제거" in a
          assert "user_image" in a and "localStorage" in a
          d=json.loads(re.search(r'<script id="source-data" type="application/json">(.*?)</script>',a,re.S).group(1))
          assert len(d)==33 and len({x['id'] for x in d})==33
          assert sum(bool(x['images'].get('A')) for x in d)==23
          assert sum(bool(x['images'].get('B')) for x in d)==23
          assert sum(bool(x['images'].get('C')) for x in d)==23
          assert sum(x['changed_pixels']==0 for x in d if x['changed_pixels'] is not None)==15
          assert sum(x['old_catalog'] for x in d)==9
          assert all(x['images'].get('A','').startswith('data:image/png;base64,') for x in d if x['images'])
          assert all(x['images'].get('B','').startswith('data:image/jpeg;base64,') for x in d if x['images'])
          with (p/m['csv_template_file']).open(encoding='utf-8-sig') as f:r=list(csv.DictReader(f))
          assert len(r)==33 and len({(x['tile_set_name'],x['local_id']) for x in r})==33
          assert all(x['status']=='미판정' and x['final_certified']=='0' for x in r)
          t=json.loads((p/m['json_template_file']).read_text())
          assert len(t['manual_decisions'])==33 and t['official_certification']==0
          z=p/m['zip_file']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==m['zip_sha256']
          with zipfile.ZipFile(z) as f:
           assert f.testzip() is None
           assert set(f.namelist())=={m['html_file'],m['csv_template_file'],m['json_template_file']}
          assert not Path('analysis/current/v193').exists()
          print('PASS offline reviewer: actual A/B/C evidence 23, exact-A source-blocked 10, zero automatic observation or certification')
          PY
      - name: Commit ZIP, standalone HTML, user review CSV and JSON to review-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v193_manual33_offline_review
          if ! git diff --cached --quiet; then
            git commit -m "v193 portable offline human review kit for 33 missing true keys; original A and actual TMX B/C included"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
