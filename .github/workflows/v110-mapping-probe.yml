name: v110 TMX TileZed text and PNG atlas grid probe
on:
  push:
    branches: [work/v110-strict-d-20261026]
    paths:
      - scripts/audit_v110_mapping.py
      - .github/workflows/v110-mapping-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /Tiles/tiledefinitions.tiles.txt
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /scripts/audit_v110_mapping.py
            /.github/workflows/v110-mapping-probe.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Compare TMX tile grid with TileZed definitions and physical PNG
        run: python3 scripts/audit_v110_mapping.py
      - name: Save noncertifying mapping probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse audits/v110_mapping_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "조사(v110): TMX 선언·TileZed 타일정의·원본 PNG 격자 불일치 분석"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
