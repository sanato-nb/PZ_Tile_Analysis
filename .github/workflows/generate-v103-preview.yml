name: v103 evidence-only 48 tiles from v102 queue
on:
  push:
    branches: [work/v103-visual-20261026]
    paths:
      - scripts/generate_v103_preview.py
      - .github/workflows/generate-v103-preview.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v102/*
            /scripts/generate_v103_preview.py
            /scripts/restore_unified_v102.py
            /.github/workflows/generate-v103-preview.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Generate images from v102 genuine unobserved queue (no identity claims)
        run: python3 scripts/generate_v103_preview.py > "$RUNNER_TEMP/v103_preview.log"
      - name: Validate A B C D images and queue uniqueness
        run: |
          python3 - <<'PY'
          import json, pathlib
          from PIL import Image
          p=pathlib.Path('checkpoints/v103_preview')
          m=json.loads((p/'EVIDENCE_MANIFEST.json').read_text())
          rows=[r for r in m['results'] if r['status']=='evidence_only_unreviewed']
          assert m['base']=='v102' and m['observed_count_added']==0
          assert len(rows)==48 and len({tuple(r['key']) for r in rows})==48
          assert all(r['primary_placement']['gid'] and r['visible_pixel_delta']>=0 for r in rows)
          assert len(m['review_sheets'])==8
          for r in rows:
            for k in ('A','B','C','D','board'):
              with Image.open(p/r[k]) as im: im.verify()
          for f in m['review_sheets']:
            with Image.open(f) as im: im.verify()
          print('PASS v103 EVIDENCE ONLY 48 KEYS, 240 JPEG, 8 SHEETS; OBSERVED ADD 0')
          PY
      - name: Commit evidence-only images, pending direct visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse checkpoints/v103_preview/
          if ! git diff --cached --quiet; then
            git commit -m "증거(v103): 미관찰 48종 원본 PNG/TMX A-B-C-D 이미지·접촉판 생성 (미판독)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
