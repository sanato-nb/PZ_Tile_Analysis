name: v258 all PNG tile definitions full catalog

on:
  push:
    branches:
      - work/v258-png-original-definition-catalog-20261031
    paths:
      - .github/workflows/build-v258-all-png-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_source_grounded_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_v258_png_tile_catalog.py
            /tiledef/tiledef.zip
            /Tiles/
            /review/v255_latest_integrated_10042_2026-10-30/MASTER_ALL_10042_LATEST_PREFERRED.csv
            /analysis/current/v258/
      - name: Install pixel inspection dependency
        run: python3 -m pip install --quiet Pillow
      - name: Check code compiles
        run: python3 -m py_compile scripts/build_v258_png_tile_catalog.py
      - name: Build all original PNG grid cells with original tile definitions
        run: python3 -u scripts/build_v258_png_tile_catalog.py
      - name: Verify catalog coverage and integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,sqlite3,zipfile,hashlib
          from pathlib import Path
          p=Path("analysis/current/v258")
          m=json.loads((p/"MANIFEST.json").read_text("utf8"))
          assert len(m["source_file_stats"])==7
          assert m["v255_keys"]==10042
          assert m["source_unique_keys"]==61418
          assert m["counters"]["image_files"]>=400
          assert m["sqlite_integrity"]=="ok"
          assert m["sqlite_row_counts"]["image_cells"]==m["counters"]["grid_cells_total"]
          assert sum(x["properties"] for x in m["source_file_stats"])==195265
          assert hashlib.sha256((p/"PZ_v258_all_png_tile_definitions.sqlite").read_bytes()).hexdigest()==m["sqlite_sha256"]
          for f in [p/"PZ_v258_full_CSV.zip",p/"PZ_v258_full_SQLite.zip"]:
              with zipfile.ZipFile(f) as z:assert z.testzip() is None
          db=sqlite3.connect(str(p/"PZ_v258_all_png_tile_definitions.sqlite"))
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          print("PASSED all PNG-grid, source, archive and SQLite checks")
          PY
      - name: Commit only new v258 output files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v258/
          if ! git diff --cached --quiet; then
            git commit -m "data(v258): catalog all Tiles PNG grid cells with seven original .tiles sources"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
