name: v74 visual review and unified SQLite verification
on:
  push:
    branches: [work/v74-evidence-20261026-0455]
    paths:
      - scripts/build_unified_v74.py
      - scripts/restore_unified_v74.py
      - scripts/build_v74_review_html.py
      - checkpoints/v74/observations.tsv
      - checkpoints/v74/verify_delta.py
      - .github/workflows/build-unified-v74.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v73/*
            /scripts/*.py
            /checkpoints/v74/*
            /checkpoints/v74_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v74.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Restore and verify v73 source database
        run: python3 scripts/restore_unified_v73.py "$RUNNER_TEMP/v73.sqlite"
      - name: Check 12 new A/B/C/D observations, PNG and TMX hashes
        run: python3 checkpoints/v74/verify_delta.py
      - name: Build v74 unified database preserving original tables
        run: python3 scripts/build_unified_v74.py "$RUNNER_TEMP/v73.sqlite"
      - name: Restore v74 from compressed shards and verify counts
        run: python3 scripts/restore_unified_v74.py "$RUNNER_TEMP/v74_roundtrip.sqlite"
      - name: Build CSV, embedded HTML and evidence ZIP
        run: python3 scripts/build_v74_review_html.py
      - name: Validate state and update handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v74-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v74_unified.sqlite
          retention-days: 90
      - name: Commit verified v74 database and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v74/ checkpoints/v74/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증: v74 신규 12종 직접 판독·SQLite 원본 보존·증거 ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
