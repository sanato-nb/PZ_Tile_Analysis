name: v112 diagnose 9 unseen original sprites and TMX layers
on:
  push:
    branches: [work/v112-unresolved-source-audit-20261026]
    paths:
      - scripts/audit_v112_remaining9_sources.py
      - .github/workflows/audit-v112-remaining9.yml
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /Tiles/tiledefinitions.tiles.txt
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /checkpoints/v111/unresolved_9.csv
            /checkpoints/v111_singleuse_preview/EVIDENCE_MANIFEST.json
            /scripts/audit_v112_remaining9_sources.py
            /audits/v112_remaining9/*
      - run: python3 -m pip install --quiet Pillow
      - name: Check source names, alpha and TMX layer stacks of all nine unseen
        run: python3 scripts/audit_v112_remaining9_sources.py
      - name: Verify exactly nine unresolved keys and no new observations
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('audits/v112_remaining9/SOURCE_AUDIT.json')
          m=json.loads(p.read_text())
          assert m['version']=='v112' and m['base_version']=='v111'
          assert m['baseline_observed']==5400 and m['new_observed']==0 and m['remaining_unobserved']==9
          assert len(m['missing_png'])==5 and len(m['zero_BC'])==4
          keys=[tuple(z['key']) for z in m['missing_png']+m['zero_BC']]
          assert len(set(keys))==9 and not m['mapping_verified'] and not m['final_certified']
          assert all(pathlib.Path(z['image_file']).exists() for z in m['zero_BC'])
          print('PASS v112 all 9 source status audit, zero fabricated progress')
          PY
      - name: Commit source audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse audits/v112_remaining9/
          if ! git diff --cached --quiet; then
            git commit -m "진단(v112): 남은 9종 PNG 누락·투명·TMX 같은 칸 레이어와 후보 원본 추적 (관찰증가 0)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
