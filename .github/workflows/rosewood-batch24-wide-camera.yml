name: Rosewood batch24 — full-frame Blockbench recheck
on:
  push:
    branches: [work/rosewood-manual-batch24-231-240-20261102]
    paths: [.github/workflows/rosewood-batch24-wide-camera.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reframe:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/render_rosewood_batch24_wide_camera.py
            /scripts/render_rosewood_batch24_native_candidates.py
            /scripts/render_rosewood_batch03_native_candidates.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_real_furniture_matches_v4/ROSEWOOD_357_PZ_TO_REAL_MINECRAFT_BLOCKSTATE_MATCH.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
      - name: Install verified Blockbench 5.2.2
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo '375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage' | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install dependencies
        run: |
          python3 -m pip install -q --break-system-packages pillow playwright numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Reopen verified source models with wider camera
        run: python3 -u scripts/render_rosewood_batch24_wide_camera.py
      - name: Verify wide camera proof
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/rosewood_furniture/2026-10-31/ten_batch_review/24_231_240/extra_decocraft_render_full_frame')
          a=json.loads((p/'NATIVE_BLOCKBENCH_PROOF.json').read_text('utf8'))
          assert len(a)==10
          ok=[x for x in a if x.get('loaded_verified') and (p/x['native_model_screenshot']).is_file()]
          assert len(ok)>=9
          print('WIDE_CAMERA_NATIVE',len(ok),'of 10')
          PY
      - name: Commit separate original wide-camera evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/rosewood_furniture/2026-10-31/ten_batch_review/24_231_240/extra_decocraft_render_full_frame/
          git diff --cached --quiet && exit 0
          git commit -m 'render(rosewood): full-frame native source proof 231-240'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
