name: Rosewood completed furniture sprite previews and Viewpoint 3D model bindings

on:
  push:
    branches:
      - work/rosewood-3d-complete-furniture-20261101
    paths:
      - .github/workflows/rosewood-complete-furniture-3d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_rosewood_complete_furniture_3d_crosswalk.py
            /Tiles/
            /analysis/current/v259/PZ_v259_all_png_tile_definitions.sqlite
            /analysis/rosewood_furniture/2026-10-31/ALL_FURNITURE_TILE_IDS.csv
            /analysis/rosewood_furniture/2026-10-31/furniture_dedup_v1/FURNITURE_MODELS_DEDUP_NAME_GROUP.csv
            /analysis/rosewood_furniture/2026-10-31/mod_matching_2026-10-31/ROSEWOOD_357_FURNITURE_MOD_CANDIDATES.csv
      - name: Install image decoder
        run: python3 -m pip install --quiet pillow
      - name: Decode actual original PNG and source-linked 3D model bindings
        run: |
          python3 -m py_compile scripts/build_rosewood_complete_furniture_3d_crosswalk.py
          python3 -u scripts/build_rosewood_complete_furniture_3d_crosswalk.py
      - name: Validate exactly 357 model cards, 30 sheets, provenance and archive CRC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,zipfile
          p=Path("analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1")
          m=json.loads((p/"MANIFEST.json").read_text("utf8"))
          assert m["total_styles"]==357
          assert m["source_3d_pack_sprite_bindings"]>500
          assert len(list((p/"previews").glob("*.png")))==357
          assert len(list((p/"contact_sheets").glob("*.jpg")))==30
          with (p/"ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv").open(encoding="utf-8-sig",newline="") as f:
              a=list(csv.DictReader(f))
          assert len(a)==357
          assert sum(a0["reference_3d_binding_coverage"]=="ALL_VARIANT_PARTS_3D_BOUND" for a0 in a)<=357
          assert all(a0["minecraft_exact_visual_match"]=="NOT_VERIFIED" for a0 in a)
          assert all((p/a0["preview_path"]).is_file() for a0 in a)
          assert sum(m["3d_binding_status_style_counts"].values())==357
          for name in ("COMPLETE_FURNITURE_CONTACT_SHEETS.zip","COMPLETE_FURNITURE_ALL_PREVIEWS.zip"):
              with zipfile.ZipFile(p/name) as z:assert z.testzip() is None
          print("PASS 357 complete furniture previews + exact source-ID 3D bindings")
          PY
      - name: Commit proven image/contact evidence only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/
          if ! git diff --cached --quiet; then
            git commit -m "data(rosewood): 357 original PNG complete furniture previews and external 3D exact sprite bindings"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
