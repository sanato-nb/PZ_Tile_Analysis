name: v107 48 direct A-B-C-D visual observations, unified SQLite and CRC
on:
  push:
    branches: [work/v107-visual-20261026]
    paths:
      - .github/workflows/build-unified-v107.yml
      - scripts/build_v107_observations.py
      - scripts/build_unified_v107.py
      - scripts/build_v107_review_html.py
      - checkpoints/v107/review_notes_*.psv
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v106/*
            /scripts/*.py
            /checkpoints/v106/observations.tsv
            /checkpoints/v107/*
            /checkpoints/v107_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
      - run: python3 -m pip install --quiet Pillow
      - name: Restore SHA256-authenticated v106 complete source SQLite
        run: python3 scripts/restore_unified_v106.py "$RUNNER_TEMP/v106.sqlite"
      - name: Compile all 48 directly inspected image notes into TSV
        run: python3 scripts/build_v107_observations.py
      - name: Validate 48 identities held/candidate, B-C, PNG/TMX SHA, and 240 JPEG
        run: python3 checkpoints/v107/verify_delta.py
      - name: Preserve prior schema and append v107 into complete SQLite
        run: python3 scripts/build_unified_v107.py "$RUNNER_TEMP/v106.sqlite"
      - name: Restore v107 using shards and re-verify all SQL counters
        run: python3 scripts/restore_unified_v107.py "$RUNNER_TEMP/v107-restored.sqlite"
      - name: Package UTF-8 CSV, 240 image embedded HTML and ZIP CRC
        run: python3 scripts/build_v107_review_html.py
      - name: Validate project state and regenerate handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v107-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v107_unified.sqlite
          retention-days: 90
      - name: Persist verified result without touching v106 or older archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v107/ checkpoints/v107/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증(v107): 신규 48종 직접시각 34후보 14보류 SQLite SHA256 HTML ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
