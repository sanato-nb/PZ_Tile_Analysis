name: Fix Green Diner and Wooden furniture source matching with real Blockbench previews
on:
  push:
    branches: [work/rosewood-chair-match-audit-20261101]
    paths: [.github/workflows/rosewood-chair-candidates-native.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/render_diner_wooden_chair_source_candidates.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_real_furniture_matches_v4/ROSEWOOD_357_PZ_TO_REAL_MINECRAFT_BLOCKSTATE_MATCH.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
      - name: Download verified Blockbench 5.2.2 official desktop renderer
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo "375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage" | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install GUI screenshot dependencies
        run: |
          python3 -m pip install -q --break-system-packages pillow playwright numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Open every alternative source chair model, compare to original PZ
        run: |
          python3 -u scripts/render_diner_wooden_chair_source_candidates.py
      - name: Assert actual native screenshot and model provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("analysis/rosewood_furniture/2026-10-31/chair_candidate_native_blockbench_v1")
          a=json.loads((p/"NATIVE_BLOCKBENCH_PROOF.json").read_text("utf8"))
          good=[x for x in a if x.get("loaded_verified") and x.get("native_model_screenshot")]
          assert len(a)==12
          assert len(good)>=10,len(good)
          assert len(list(p.glob("*_PZ_VS_NEW_MC_CANDIDATE.jpg")))>=10
          for x in good:
            assert (p/x["native_model_screenshot"]).exists()
            assert len(x["source_sha256"])==64
          print("CHAIR_VETTED_MODELS",len(good))
          PY
      - name: Commit corrected comparison evidence (source JAR not copied)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/rosewood_furniture/2026-10-31/chair_candidate_native_blockbench_v1/
          git commit -m "evidence(rosewood): 12 native Blockbench chair model previews against Green Dinner and Wooden PZ original"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
