name: B42 v36 all warning coordinate evidence
on:
  push:
    branches: ['work/pz-b42-coordinate-map-evidence-v36-20261106']
    paths: ['scripts/audit_b42_warning_layouts_v36.py', '.github/workflows/b42-v36-warning-layouts.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.tmx
            /analysis/furniture_full_b42/2026-11-06/geometry_warning_v30/V30_EXACT_SOURCE_KEY_POSITION_PNG_INDEX.csv
            /scripts/audit_b42_warning_layouts_v36.py
      - run: python3 -m pip install numpy
      - run: python3 scripts/audit_b42_warning_layouts_v36.py
      - name: Record verified layout evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/furniture_full_b42/2026-11-06/warning_layouts_v36/*.csv
          git commit -m 'Record B42 map evidence for all coordinate-warning groups'
          git push origin HEAD:"$GITHUB_REF_NAME"
