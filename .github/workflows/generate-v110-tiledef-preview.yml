name: v110 provisional TileZed grid A-B-C-D evidence for 30 keys
on:
  push:
    branches: [work/v110-strict-d-20261026]
    paths:
      - scripts/generate_v110_tiledef_preview.py
      - .github/workflows/generate-v110-tiledef-preview.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /Tiles/tiledefinitions.tiles.txt
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v108/*
            /audits/v110_remaining_D_scan.json
            /scripts/generate_v110_tiledef_preview.py
            /scripts/restore_unified_v108.py
            /.github/workflows/generate-v110-tiledef-preview.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Render A B C D from original PNG using provisional TileZed grid
        run: python3 scripts/generate_v110_tiledef_preview.py > "$RUNNER_TEMP/v110_tiledef.log"
      - name: Verify 30 actual D and image files without certification
        run: |
          python3 - <<'PY'
          import json,pathlib
          from PIL import Image
          p=pathlib.Path('checkpoints/v110_tiledef_preview')
          m=json.loads((p/'EVIDENCE_MANIFEST.json').read_text())
          rows=[r for r in m['results'] if r['status']=='evidence_only_unreviewed']
          assert m['base']=='v108' and m['observed_count_added']==0
          assert m['tiledef_grid_provisional'] and not m['mapping_verified']
          assert len(rows)==30 and len({tuple(r['key']) for r in rows})==30
          assert all(r['other_placement_available'] for r in rows)
          assert all((r['primary_placement']['tmx'],r['primary_placement']['level'],r['primary_placement']['x'],r['primary_placement']['y']) != (r['other_placement']['tmx'],r['other_placement']['level'],r['other_placement']['x'],r['other_placement']['y']) for r in rows)
          assert len(m['review_sheets'])==5
          for r in rows:
            for k in ('A','B','C','D','board'):
              with Image.open(p/r[k]) as im: im.verify()
          for f in m['review_sheets']:
            with Image.open(f) as im: im.verify()
          print('PASS 30 distinct D, 150 JPEG, 5 sheets; mapping provisional; observed added 0')
          PY
      - name: Preserve provisional evidence for direct visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse checkpoints/v110_tiledef_preview/
          if ! git diff --cached --quiet; then
            git commit -m "증거(v110): TileZed 텍스트 격자 잠정 매핑으로 실제 D 30종 A-B-C-D 생성 (미인증)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
