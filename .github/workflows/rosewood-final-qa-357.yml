name: Rosewood 357 final index QA

on:
  push:
    branches:
      - work/rosewood-final-qa-index-357-20261102
    paths:
      - analysis/rosewood_furniture/2026-10-31/ten_batch_review/FINAL_QA_357_20261102/**
      - scripts/verify_rosewood_final_qa_357.py
      - .github/workflows/rosewood-final-qa-357.yml
  pull_request:
    paths:
      - analysis/rosewood_furniture/2026-10-31/ten_batch_review/FINAL_QA_357_20261102/**
      - scripts/verify_rosewood_final_qa_357.py
      - .github/workflows/rosewood-final-qa-357.yml

jobs:
  verify-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 357 unique records and status/backlog consistency
        run: python scripts/verify_rosewood_final_qa_357.py
