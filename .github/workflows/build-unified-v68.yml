name: v68 tile evidence and SQLite verification
on:
  push:
    branches: [work/v68-bulk-20261026]
    paths:
      - scripts/build_unified_v68.py
      - scripts/restore_unified_v68.py
      - scripts/build_v68_review_html.py
      - checkpoints/v68/observations.tsv
      - checkpoints/v68/verify_delta.py
      - .github/workflows/build-unified-v68.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v67/*
            /scripts/*.py
            /checkpoints/v68/*
            /checkpoints/v68_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v68.yml
      - run: python3 -m pip install --quiet Pillow
      - run: python3 scripts/restore_unified_v67.py "$RUNNER_TEMP/v67.sqlite"
      - run: python3 checkpoints/v68/verify_delta.py
      - run: python3 scripts/build_unified_v68.py "$RUNNER_TEMP/v67.sqlite"
      - run: python3 scripts/restore_unified_v68.py "$RUNNER_TEMP/v68_roundtrip.sqlite"
      - run: python3 scripts/build_v68_review_html.py
      - run: python3 scripts/validate_project.py
      - run: python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v68-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v68_unified.sqlite
          retention-days: 90
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v68/ checkpoints/v68/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증: v68 시각판독 80종과 통합 SQLite·ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
