      - run: python3 -m pip install --quiet Pillow
      - name: Rebuild original B with alternative A crop for each same tile
        run: python3 -u scripts/v130_D_run_v127_alternates_800_1119.py
      - name: Verify source pixel hashes, zero original mutation, candidate labeling, archived images and physical historical SQLite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,sqlite3,base64,zlib,csv
          P=Path('.')
          m=json.loads((P/'review/v130_D_alt_A_B_320/MANIFEST.json').read_text())
          dbm=json.loads((P/'analysis/current/v130/MANIFEST.json').read_text())
          assert m['corrected_D_definition'].startswith('different A candidate')
          assert m['not_v124_second_placement'] is True
          assert m['source_v120_index_range']==[800,1119]
          assert m['scope_new_only']==320
          assert dbm['prior_tables_preserved']==191
          assert m['D_alternative_rendered']+m['D_held']==320
          def digest(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          for path,expected in ((m['evidence_csv'],m['evidence_csv_sha256']),
                                (m['trials_csv'],m['trials_csv_sha256']),
                                (m['D_scene_archive'],m['D_scene_archive_sha256'])):
              assert digest(P/path)==expected
          with (P/m['evidence_csv']).open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==320 and len(set((r['tile_set_name'],r['local_id']) for r in rows))==320
          assert [int(rows[0]['index']),int(rows[-1]['index'])]==[800,1119]
          assert all(r['correspondence_verified']==r['tilezed_verified']==r['identity_certified']=='0' for r in rows)
          assert all(r['human_visual_review_completed']=='0' for r in rows)
          assert all(r['alternate_source_grid'] in ('adjacent_grid_not_same_key','same_basename_atlas_variant','same_key_A_grid','') for r in rows)
          assert all(r['identity_certified']=='0' for r in rows)
          with zipfile.ZipFile(P/m['D_scene_archive']) as z:
              assert z.testzip() is None
          for name,expected in m['review_sheet_sha256'].items():
              assert digest(P/'review/v130_D_alt_A_B_320'/name)==expected
          payload=base64.b64decode(''.join((P/p).read_text() for p in dbm['parts']))
          assert hashlib.sha256(payload).hexdigest()==dbm['compressed_sha256']
          raw=zlib.decompress(payload)
          assert len(raw)==dbm['sqlite_bytes']
          assert hashlib.sha256(raw).hexdigest()==dbm['sqlite_sha256']
          path=Path('/tmp/v130-independent.sqlite')
          path.write_bytes(raw)
          with sqlite3.connect(path) as c:
              assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              for table,n in [('tile_catalog',5409),('v121_abcd_evidence',160),
               ('v122_ai_visual_review_160',160),('v123_abcd_evidence_next160',160),
               ('v124_d_placement_4472',4472),('v125_ai_visual_spotcheck_20',20),
               ('v126_alt_A_B_160',160),('v127_d_candidate_catalog_4633',4633),('v128_D_source_variant_B_3',3),('v130_alt_A_B_320',320)]:
                  assert c.execute('SELECT count(*) FROM '+table).fetchone()[0]==n
              assert c.execute('SELECT count(*) FROM tile_catalog WHERE observed_any=1').fetchone()[0]==5400
              assert c.execute('SELECT count(*) FROM tile_catalog WHERE identity_final_certified=1').fetchone()[0]==0
          print('PASS v130 320 original B rerenders from v127 candidates, ZIP/SHA, 192 tables')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v130-D-v127-preselected-320-unverified
          path: |
            review/v130_D_alt_A_B_320/
            analysis/current/v130/
          retention-days: 90
          compression-level: 0
      - name: Commit verified new evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v130_D_alt_A_B_320/ analysis/current/v130/
          if ! git diff --cached --quiet; then
            git commit -m "v130: execute 320 v127 preselected other A hypotheses preserving v129 DB"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
