      - run: python3 -m pip install --quiet Pillow
      - name: Recheck original TMX and source PNG pixels, derive visual evidence and append-only SQLite
        run: python3 -u scripts/v132_visual3_jumbo20_audit.py
      - name: Validate new evidence hashes and status separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,csv,base64,zlib,sqlite3
          o=Path('review/v132_visual3_jumbo20');m=json.loads((o/'MANIFEST.json').read_text())
          assert m['direct_visual_reviews']==3 and m['jumbo_source_and_gid_verified_but_not_grid']==20
          assert m['unreviewed_exception_rows']==271
          assert m['mapping_verified']==m['tilezed_verified']==m['certified']==0
          for name,d in {**m['images'],**m['csvs']}.items():assert hashlib.sha256((o/name).read_bytes()).hexdigest()==d
          db=json.loads(Path('analysis/current/v132/MANIFEST.json').read_text())
          data=zlib.decompress(base64.b64decode(''.join(Path(p).read_text().strip() for p in db['parts'])))
          assert hashlib.sha256(data).hexdigest()==db['sqlite_sha256'] and len(data)==db['sqlite_bytes']
          con=sqlite3.connect(':memory:');con.deserialize(data)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert len(con.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall())==194
          assert con.execute('SELECT count(*) FROM v132_visual3_jumbo20').fetchone()[0]==23
          assert con.execute('SELECT count(*) FROM v132_visual3_jumbo20 WHERE observed=1').fetchone()[0]==3
          assert con.execute('SELECT count(*) FROM v132_visual3_jumbo20 WHERE certified!=0 OR mapping_verified!=0 OR tilezed_verified!=0').fetchone()[0]==0
          print('PASS validated 194 physical SQLite tables',db['sqlite_sha256'])
          PY
      - name: Commit new v132 outputs on separate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v132_visual3_jumbo20 analysis/current/v132
