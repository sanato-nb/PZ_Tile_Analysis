name: v111 single-use 12 visual candidates and 9 held, full SQLite and ZIP CRC
on:
  push:
    branches: [work/v111-single-use-source-audit-20261026]
    paths:
      - .github/workflows/build-unified-v111.yml
      - scripts/build_v111_observations.py
      - scripts/build_unified_v111.py
      - scripts/build_v111_review_html.py
      - checkpoints/v111/review_notes_000_015.psv
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /Tiles/tiledefinitions.tiles.txt
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v110/*
            /scripts/*.py
            /checkpoints/v110/observations.tsv
            /checkpoints/v111/*
            /checkpoints/v111_singleuse_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
      - run: python3 -m pip install --quiet Pillow
      - name: Restore SHA-verified full v110 source SQLite
        run: python3 scripts/restore_unified_v110.py "$RUNNER_TEMP/v110.sqlite"
      - name: Compile 16 direct visual reviews into 12 observed and 9 pending
        run: python3 scripts/build_v111_observations.py
      - name: Validate PNG and TMX SHA, 80 JPEG, 21 unique keys, all 12 removal deltas
        run: python3 checkpoints/v111/verify_delta.py
      - name: Physically preserve v110 SQLite and add 12 candidates, keep 9 unseen
        run: python3 scripts/build_unified_v111.py "$RUNNER_TEMP/v110.sqlite"
      - name: Restore v111 full database SHA and integrity check
        run: python3 scripts/restore_unified_v111.py "$RUNNER_TEMP/v111-restored.sqlite"
      - name: Make HTML with 80 images, CSV, 89-entry ZIP CRC
        run: python3 scripts/build_v111_review_html.py
      - name: Validate project state and regenerate handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v111-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v111_unified.sqlite
          retention-days: 90
      - name: Commit verified evidence without changing old archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v111/ checkpoints/v111/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증(v111): 단일 A-B-C 시각 12종, 미관찰 9종, SHA SQLite CRC 보존"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
