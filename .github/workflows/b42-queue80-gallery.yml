name: B42 queue image gallery
on:
  push:
    branches: ['work/pz-b42-80-candidate-image-gallery-20261106']
    paths: ['scripts/gallery_b42_queue80.py','.github/workflows/b42-queue80-gallery.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/gallery_b42_queue80.py
            /analysis/furniture_full_b42/2026-11-06/registry_map_v39/B42_FURNITURE_V39.zip
            /analysis/furniture_full_b42/2026-11-06/registry_map_v39/V39_80_MAP_EVIDENCE_QUEUE.csv
      - run: python3 -m pip install Pillow requests remotezip beautifulsoup4
      - run: python3 scripts/gallery_b42_queue80.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/furniture_full_b42/2026-11-06/queue80_gallery/
          git diff --cached --quiet && exit 0
          git commit -m 'Save queue image references and source crops'
          git push origin HEAD:"$GITHUB_REF_NAME"
