      - run: python3 -m pip install --quiet Pillow
      - name: Re-render original B with v127 alternative A
        env:
          D_START: ${{ matrix.start }}
        run: python3 -u scripts/v131_D_worker.py
      - name: Verify candidate-flag integrity and source ZIP CRC
        env:
          D_TAG: ${{ matrix.tag }}
        run: |
          python3 - <<'PY'
          import os,csv,json,zipfile,hashlib
          from pathlib import Path
          p=Path('review/v131_D_remaining_3832')/('batch_'+os.environ['D_TAG'])
          m=json.loads((p/'MANIFEST.json').read_text('utf8'))
          assert m['scope_new_only']==m['D_alternative_rendered']+m['D_held']
          assert m['A_mapping_certified']==m['TileZed_certified']==m['identity_certified']==0
          with (p/m['evidence_csv']).open(encoding='utf-8-sig',newline='') as f:r=list(csv.DictReader(f))
          assert len(r)==m['scope_new_only'] and len({(x['tile_set_name'],x['local_id']) for x in r})==len(r)
          assert all(x['correspondence_verified']==x['tilezed_verified']==x['identity_certified']=='0' for x in r)
          for name,d in [(m['evidence_csv'],m['evidence_csv_sha256']), (m['trial_csv'],m['trial_csv_sha256']),(m['zip_path'],m['zip_sha256'])]:
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==d
          with zipfile.ZipFile(p/m['zip_path']) as z:
            assert z.testzip() is None and len(z.namelist())==m['zip_entries']
          for name,d in m['review_sheet_sha256'].items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==d
          print('PASS v131 batch',os.environ['D_TAG'],m['D_alternative_rendered'],m['D_held'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v131-${{ matrix.tag }}
          path: review/v131_D_remaining_3832/batch_${{ matrix.tag }}/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
  aggregate:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v131_D_aggregate_all.py
            /scripts/restore_unified_v131.py
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v120_B_context_new4632/B_CONTEXT_4632.csv
            /review/v126_D_alt_A_B_160/D_ALTERNATIVE_A_B_160.csv
            /review/v129_D_alt_A_B_320/D_ALTERNATIVE_A_B_320.csv
            /review/v130_D_alt_A_B_320/D_ALTERNATIVE_A_B_320.csv
            /analysis/current/v130/*
            /review/v131_D_remaining_3832/*
            /analysis/current/v131/*
      - uses: actions/download-artifact@v4
        with:
          pattern: v131-*
          path: .v131_bundles
          merge-multiple: false
      - name: Merge all batches and restore full 193-table SQLite
        run: |
          mkdir -p review/v131_D_remaining_3832
          for dir in .v131_bundles/v131-*; do
            tag=${dir##*/v131-}
            test -f "$dir/MANIFEST.json"
            mv "$dir" "review/v131_D_remaining_3832/batch_$tag"
          done
          test "$(find review/v131_D_remaining_3832 -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 12
          python3 -u scripts/v131_D_aggregate_all.py
          python3 -u scripts/restore_unified_v131.py /tmp/PZ_v131_independent.sqlite
      - name: Independently validate all 4633 scope keys and certification zero
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('review/v131_D_remaining_3832')
          m=json.loads((p/'MANIFEST.json').read_text('utf8'))
          assert m['new_3832_rows']==3832 and m['full_target_4632_status_indexed']==4632
          assert m['new_scope_4633']==4633 and m['A_missing_1']==1 and len(m['batches'])==12
          assert m['D_experimental_rendered']+m['D_held_with_A']==4632
          assert m['official_same_key_A_mapping_verified']==m['tilezed_verified']==m['final_identity_certified']==0
          with (p/'D_FULL_SCOPE_4633_STATUS.csv').open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==4633 and len({(r['tileset'],r['local_id']) for r in rows})==4633
          assert all(r['mapping_verified']==r['final_certified']==r['tilezed_verified']=='0' for r in rows)
          print('PASS all 4633 D status records')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v131-all-D-evidence-full-4633
          path: |
            review/v131_D_remaining_3832/
            analysis/current/v131/
          retention-days: 90
          compression-level: 0
      - name: Commit v131 evidence and full SQLite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v131_D_remaining_3832/ analysis/current/v131/
          git commit -m "v131: all 3832 outstanding D cases, 4633 full D status, historical SQLite preserved"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
