name: v250 original A 112 detailed inspection boards
on:
  push:
    branches: [review/v250_held112_Afirst_individual_20261030]
    paths:
      - scripts/v250_build_112_A_contact.py
      - scripts/v250_aggregate_112.py
      - .github/workflows/v250-Afirst-112.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_A_and_true_alt_B_review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v250_build_112_A_contact.py
            /scripts/v250_aggregate_112.py
            /review/v250_held112_Afirst_individual_2026-10-30/*
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v119_selected_A_new4633/MANIFEST.json
            /review/v119_selected_A_new4633/selected_png_shards/*
      - name: Select exactly 112 earlier true B/C evidence panels
        run: |
          python3 - <<'PY'
          import csv
          p='review/v250_held112_Afirst_individual_2026-10-30/EXACT_PENDING_112_KEY_CROSSWALK.csv'
          a=list(csv.DictReader(open(p,encoding='utf-8-sig',newline='')))
          assert len(a)==112 and len({x['source_key'] for x in a})==112
          with open('/tmp/paths','w') as f:
            for line in ['/scripts/v250_build_112_A_contact.py','/scripts/v250_aggregate_112.py','/review/v250_held112_Afirst_individual_2026-10-30/*','/review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv','/review/v119_selected_A_new4633/MANIFEST.json','/review/v119_selected_A_new4633/selected_png_shards/*']:
              f.write(line+'\n')
            for x in a:f.write('/'+x['exact_source_qualified_BC_panel']+'\n')
          print('112 true original B evidence panels referenced')
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/paths
      - name: Verify source A PNG and RGBA SHA and generate A/B sheets
        run: |
          python3 -m pip install --quiet Pillow --break-system-packages
          python3 -u scripts/v250_build_112_A_contact.py
      - name: Consolidate all 112 human A morphology notes
        run: python3 scripts/v250_aggregate_112.py
      - name: Commit only new evidence, preserve original source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v250_held112_Afirst_individual_2026-10-30/
          if ! git diff --cached --quiet; then
             git commit -m "v250: exactly 112 original A pixel-hash audits and seven A plus real B sheets"
             git pull --rebase origin "$GITHUB_REF_NAME"
             git push
          fi
