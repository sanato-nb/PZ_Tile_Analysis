name: v180 239 remaining original tile source keys full 84-TMX multi-scene search and evidence rendering
on:
  push:
    branches: [work/v180-remnant239-multisite-source-20261028]
    paths:
      - scripts/v180_remnant239_multisite.py
      - scripts/v180_finalize_checkpoint.py
      - .github/workflows/v180-remnant239-multisite.yml
permissions:
  contents: write
concurrency:
  group: v180-remnant239-${{ github.ref }}
  cancel-in-progress: true
jobs:
  multisite:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v180_remnant239_multisite.py
            /scripts/v180_finalize_checkpoint.py
            /PROJECT_STATE.json
            /AGENTS.md
            /docs/HANDOFF.md
            /analysis/current/v179/*
            /review/v175_remaining381_evidence_audit/REMAINING_381_EVIDENCE_AUDIT.csv
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v117_A_candidates_10042/A_CANDIDATE_COMBINED_10042.csv
            /review/v177_alternate_visual23/VISUAL_REVIEW_23.csv
            /review/v179_alternative163_visual/VISUAL_REVIEW_108.csv
            /review/v176_alt_scene_48/ALT_SCENE_RESULTS_48.csv
            /review/v178_alt_scene_bulk172/ALT_SCENE_RESULTS_163.csv
            /audits/map_range_26_43_to_37_49/SUMMARY.json
            /B4220.3_MapExport_256/tmx/*
      - name: Hydrate source PNG files referenced by original tileset A candidates
        run: |
          python3 - <<'PY' > /tmp/pz_v180_atlases.txt
          import csv
          paths=set()
          for fname,field in [
            ('review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv','source_image_path'),
            ('review/v117_A_candidates_10042/A_CANDIDATE_COMBINED_10042.csv','source_png_path')]:
           with open(fname,encoding='utf-8-sig') as f:
            for r in csv.DictReader(f):
             if r.get(field):paths.add(r[field])
          for path in sorted(paths):
           assert path.startswith('Tiles/') and '..' not in path,path
           print('/'+path)
          PY
          git sparse-checkout add --stdin < /tmp/pz_v180_atlases.txt
      - run: python3 -m pip install --quiet Pillow
      - name: Scan actual 84 TMX original GIDs and render up to 64 entirely NEW B-C scene contexts
        run: python3 -u scripts/v180_remnant239_multisite.py
      - name: Independently verify 239-key census, raw A B C ZIP and immutable 241-table parent rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,csv,hashlib,json,sqlite3,zipfile,zlib
          R=Path('review/v180_remnant239_multisite')
          m=json.loads((R/'MANIFEST.json').read_text())
          d=json.loads(Path('analysis/current/v180/MANIFEST.json').read_text())
          p=json.loads(Path('analysis/current/v179/MANIFEST.json').read_text())
          assert m['source_map_count']==84 and m['actual_distinct_new_A_missing_keys']==239
          assert m['historical_missing_old_keys']==9
          assert m['checkpoint_missing']==250 and m['physical_missing_total']==248 and m['unreconciled_difference']==2
          assert 0<m['new_TMX_context_candidates_rendered']<=64
          n=m['new_TMX_context_candidates_rendered']
          assert m['source_candidates_with_positive_new_B_C']+m['source_candidates_with_new_B_C_zero']==n
          assert m['original_source_keys_with_fresh_untried_inbounds_sites']+m['original_source_keys_without_untried_5x5_sites']==239
          assert m['new_observed']==m['official_mapping_verified']==m['tilezed_verified']==m['final_identity_certified']==0
          assert d['version']=='v180' and d['parent']=='v179' and d['parent_sqlite_sha256']==p['sqlite_sha256']
          assert d['table_count']==242 and d['prior_tables_preserved']==241
          assert d['new_rows']==n and d['new_observed_rows']==0
          with (R/'UNOBSERVED_239_ADDITIONAL_SITE_CENSUS.csv').open(encoding='utf-8-sig') as f:allkeys=list(csv.DictReader(f))
          with (R/'ALTERNATE_SELECTED_SCENES.csv').open(encoding='utf-8-sig') as f:rendered=list(csv.DictReader(f))
          assert len(allkeys)==239 and len({(x['tile_set_name'],x['local_id']) for x in allkeys})==239
          assert len(rendered)==n and len({(x['tile_set_name'],x['local_id']) for x in rendered})==n
          assert all(x['observed']==x['certified']==x['official_mapping_verified']==x['tilezed_verified']=='0' for x in rendered)
          assert all(int(x['additional_locations_tried'])>=1 for x in rendered)
          assert all(int(x['selected_B_C_changed_pixels'])>=0 for x in rendered)
          assert hashlib.sha256((R/'UNOBSERVED_239_ADDITIONAL_SITE_CENSUS.csv').read_bytes()).hexdigest()==m['CSV_239_sha256']
          assert hashlib.sha256((R/'ALTERNATE_SELECTED_SCENES.csv').read_bytes()).hexdigest()==m['selected_csv_sha256']
          assert hashlib.sha256((R/'ALTERNATE_MULTISITE_IMAGES.zip').read_bytes()).hexdigest()==m['archive_sha256']
          with zipfile.ZipFile(R/'ALTERNATE_MULTISITE_IMAGES.zip') as z:
           assert z.testzip() is None and len(z.namelist())==4*n
          def load(man):
           comp=base64.b64decode(''.join(Path(x).read_text('ascii').strip() for x in man['parts']),validate=True)
           assert hashlib.sha256(comp).hexdigest()==man['compressed_sha256']
           raw=zlib.decompress(comp)
           assert hashlib.sha256(raw).hexdigest()==man['sqlite_sha256'] and len(raw)==man['sqlite_bytes']
           return raw
          a=sqlite3.connect(':memory:');a.deserialize(load(p))
          b=sqlite3.connect(':memory:');b.deserialize(load(d))
          assert a.execute('PRAGMA integrity_check').fetchone()[0]=='ok' and b.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          old={r[0]:a.execute('SELECT count(*) FROM "'+r[0]+'"').fetchone()[0] for r in a.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          new={r[0]:b.execute('SELECT count(*) FROM "'+r[0]+'"').fetchone()[0] for r in b.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert len(old)==241 and len(new)==242
          assert set(new)-set(old)=={'v180_additional_TMX_scene_evidence'}
          assert new['v180_additional_TMX_scene_evidence']==n
          for tab,count in old.items():
           assert new[tab]==count,('row_count_changed',tab)
           x=a.execute('SELECT * FROM "'+tab+'"');y=b.execute('SELECT * FROM "'+tab+'"')
           while True:
            p1=x.fetchmany(512);p2=y.fetchmany(512)
            assert p1==p2,('parent_sqlite_row_changed',tab)
            if not p1:break
          assert b.execute('SELECT SUM(observed),SUM(certified),SUM(official_mapping_verified),SUM(tilezed_verified) FROM v180_additional_TMX_scene_evidence').fetchone()==(0,0,0,0)
          print('PASS v180 source evidence for',n,'keys, 239-key full census, exact 241 parent table row preservation')
          PY
      - name: Update checkpoint only after successful independent source and SQLite validation
        run: python3 -u scripts/v180_finalize_checkpoint.py
      - name: Commit verified source evidence in isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v180_remnant239_multisite analysis/current/v180 PROJECT_STATE.json AGENTS.md docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "v180 real TMX extra-placement source evidence for unobserved A keys, preserved 242 SQLite tables"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
