      - name: Count unique tile layer IDs from all 84 TMX files
        run: python3 scripts/count_unique_tiles_26_43_to_37_49.py
      - name: Independently crosscheck saved counts, map files and hashes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,csv
          base=pathlib.Path("audits/map_range_26_43_to_37_49")
          report=json.loads((base/"SUMMARY.json").read_text())
          with (base/"DISTINCT_TILE_KEYS.csv").open(encoding="utf-8-sig",newline="") as f:
            keys=list(csv.DictReader(f))
          with (base/"PER_MAP.csv").open(encoding="utf-8-sig",newline="") as f:
            maps=list(csv.DictReader(f))
          assert len(maps)==report["files_present"]==report["files_expected"]==84
          assert len(keys)==report["distinct_tile_keys_tile_layers"]
          assert len({(x["tile_set_name"],int(x["local_id"])) for x in keys})==len(keys)
          assert report["files_missing"]==[] and report["unique_tile_object_only_keys"]>=0
          for m in maps:
            p=pathlib.Path("B4220.3_MapExport_256/tmx")/m["tmx"]
            assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          assert sum(int(m["occupied_layer_positions"]) for m in maps)==report["total_occupied_layer_positions_before_deduplication"]
          print("PASS 84 TMX, distinct keys",len(keys),"maps",len(maps))
          PY
      - name: Save counts and source evidence without touching existing checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse audits/map_range_26_43_to_37_49/
          if ! git diff --cached --quiet; then
            git commit -m "실측: 26_43~37_49 실제 TMX 84개 고유 타일 ID 중복 제거 수치와 CSV"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
