name: PROBE native Blockbench for Macaw Paladin Refurbished Handcrafted vanilla JSON geometry
on:
  push:
    branches: [work/rosewood-all-357-real-render-20261101]
    paths: [.github/workflows/rosewood-native-all-json-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/native_blockbench_render_vanilla_furniture.py
            /analysis/rosewood_furniture/2026-10-31/pz_mc_furniture_357_rematch_v3/REVISED_357_PZ_MC_MATCHES.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
      - name: Get verified official Blockbench 5.2.2
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo "375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage" | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install render dependencies
        run: |
          python3 -m pip install -q --break-system-packages pillow numpy playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Probe actual vanilla JSON to Blockbench imported model with texture references
        run: |
          python3 -u scripts/native_blockbench_render_vanilla_furniture.py PROBE
      - name: Verify screenshots are actually generated by native Blockbench renderer
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("analysis/rosewood_furniture/2026-10-31/native_real_mod_models_remaining_v1")
          a=json.loads((p/"PROOF_PROBE.json").read_text("utf8"))
          assert len(a)>=2
          for x in a:
            print(x["blockstate_id"],x.get("cubes"),x.get("textures"),x.get("image"),x.get("error"),x.get("missing",[])[:3])
          assert sum("image" in x for x in a)>=2
          PY
      - name: Persist probe evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/native_real_mod_models_remaining_v1/
          git commit -m "evidence(rosewood): source verified vanilla model actual Blockbench renderer four-mod probe"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
