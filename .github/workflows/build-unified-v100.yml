name: v100 216 A-B-C-D near/absent tile direct visual review SQLite verification
on:
  push:
    branches: [work/v100-visual-20261026]
    paths:
      - scripts/build_unified_v100.py
      - scripts/restore_unified_v100.py
      - scripts/build_v100_review_html.py
      - checkpoints/v100/observations.tsv
      - checkpoints/v100/verify_delta.py
      - .github/workflows/build-unified-v100.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v99/*
            /scripts/*.py
            /checkpoints/v100/*
            /checkpoints/v100_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v100.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Verify v99 SHA and restore complete base SQLite
        run: python3 scripts/restore_unified_v99.py "$RUNNER_TEMP/v99.sqlite"
      - name: Verify 216 A B C, 23 nearby D and 193 unavailable D original evidence
        run: python3 checkpoints/v100/verify_delta.py
      - name: Build v100 integrated SQLite keeping all historical tables
        run: python3 scripts/build_unified_v100.py "$RUNNER_TEMP/v99.sqlite"
      - name: Restore v100 and validate counts
        run: python3 scripts/restore_unified_v100.py "$RUNNER_TEMP/v100_rebuilt.sqlite"
      - name: Build 2 HTML + CSV + evidence CRC ZIP
        run: python3 scripts/build_v100_review_html.py
      - name: Verify project state and refresh handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v100-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v100_unified.sqlite
          retention-days: 90
      - name: Commit v100 certified checkpoint artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v100/ checkpoints/v100/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증: v100 신규 216종 A/B/C 판독·D 없음·SQLite SHA·ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
