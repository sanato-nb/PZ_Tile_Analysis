name: v159 prep 40 original A B C images for human visual analysis
on:
  push:
    branches: [work/v159-abc-3760-3799-20261028-0155]
    paths:
      - scripts/v159_prepare_abc40.py
      - .github/workflows/v159-abc-prep.yml
permissions:
  contents: write
concurrency:
  group: v159-prep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v159_prepare_abc40.py
            /analysis/imports/merged_catalog_5409.csv
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v120_B_context_new4632/B_CONTEXT_4632.csv
            /review/v120_B_context_new4632/b_png_shards/*
            /review/v121_C_diff_new4632/C_B_DIFFERENCE_4632.csv
            /review/v121_C_diff_new4632/c_png_shards/*
            /review/v121_C_diff_new4632/difference_png_shards/*
            /Tiles/*
            /B4220.3_MapExport_256/tmx/*
      - run: python3 -m pip install --quiet Pillow
      - name: Verify original PNG pixels, raw TMX GIDs and B/C/difference files, prepare visible proof
        run: python3 -u scripts/v159_prepare_abc40.py
      - name: Independent source sheet SHA and 40-row integrity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,json
          p=Path('review/v159_abc_3760_3799')
          m=json.loads((p/'PREP_MANIFEST.json').read_text())
          assert m['source_verified']==40 and m['provisional_promoted']==m['certified']==0
          with (p/'SOURCE_A_B_C_CHECKS.csv').open(encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          assert len(rows)==40 and len({(r['tile_set_name'],r['local_id']) for r in rows})==40
          assert [int(r['index']) for r in rows]==list(range(3760,3800))
          assert all(r['visual_observed']=='0' and r['certified']=='0' for r in rows)
          for name,h in m['proof_sha256'].items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h,name
          assert len(list((p/'prep').glob('proof_*.jpg')))==8
          print('PASS v159 source-only visual preparation, 40 items, no identity promotion')
          PY
      - name: Commit source-verified proof to isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v159_abc_3760_3799
          if ! git diff --cached --quiet; then
            git commit -m "v159: save verified A/B/C proof sheets for 40 pending visual reviews"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
