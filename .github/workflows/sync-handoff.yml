name: 타일 분석 인수인계 자동 갱신

on:
  push:
    branches: [main]
    paths:
      - "PROJECT_STATE.json"
      - "checkpoints/**"
      - "scripts/generate_handoff.py"
      - "scripts/validate_project.py"
      - ".github/workflows/sync-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 인수인계 관련 파일만 가져오기
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /PROJECT_STATE.json
            /AGENTS.md
            /docs/
            /scripts/
            /checkpoints/
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: 프로젝트 상태 검사
        run: python3 scripts/validate_project.py
      - name: 최신 인수인계서 생성
        run: python3 scripts/generate_handoff.py
      - name: 변경된 인수인계서 GitHub에 저장
        shell: bash
        run: |
          if ! git diff --quiet -- docs/HANDOFF.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/HANDOFF.md
            git commit -m "문서: 최신 타일 분석 인수인계 자동 갱신"
            git push
          else
            echo "docs/HANDOFF.md already up to date."
          fi
