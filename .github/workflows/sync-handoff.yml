name: Sync PZ tile analysis handoff

on:
  push:
    branches: [main]
    paths:
      - "PROJECT_STATE.json"
      - "checkpoints/**"
      - "scripts/generate_handoff.py"
      - "scripts/validate_project.py"
      - ".github/workflows/sync-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only handoff files (skip huge originals)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /PROJECT_STATE.json
            /AGENTS.md
            /docs/
            /scripts/
            /checkpoints/
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Validate state
        run: python3 scripts/validate_project.py
      - name: Regenerate latest handoff
        run: python3 scripts/generate_handoff.py
      - name: Commit generated handoff if changed
        shell: bash
        run: |
          if ! git diff --quiet -- docs/HANDOFF.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/HANDOFF.md
            git commit -m "docs: auto-sync latest tile analysis handoff"
            git push
          else
            echo "docs/HANDOFF.md already up to date."
          fi
