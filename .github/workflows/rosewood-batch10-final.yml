name: Validate tenth Rosewood furniture matching group 091-100 and persist actual source screenshots
on:
  push:
    branches: [work/rosewood-manual-batch10-091-100-20261101]
    paths: [.github/workflows/rosewood-batch10-final.yml, scripts/complete_rosewood_batch_091_100.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/complete_rosewood_batch_091_100.py
            /analysis/rosewood_furniture/2026-10-31/all_357_complete_native_comparisons_v1/ALL_357_FULL_RENDER_MATCHING.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
            /analysis/rosewood_furniture/2026-10-31/ten_batch_review/10_091_100/extra_decocraft_render/
            /analysis/rosewood_furniture/2026-10-31/ten_batch_review/02_011_020/extra_decocraft_render/
            /analysis/rosewood_furniture/2026-10-31/blockbench_native_357_rematch_v1/
            /analysis/rosewood_furniture/2026-10-31/ten_batch_review/batch_081_090_v1/BATCHES_ALL_357_PROGRESS.csv
            /analysis/rosewood_furniture/2026-10-31/blockbench_native_replacement_candidates_v1/
            /analysis/rosewood_furniture/2026-10-31/ten_batch_review/batch_011_020_v1/BATCHES_ALL_357_PROGRESS.csv
      - name: Install Python image dependencies
        run: python3 -m pip install --break-system-packages -q pillow numpy
      - name: Run visual quality-reviewed batch 091 to 100
        run: |
          python3 -m py_compile scripts/complete_rosewood_batch_091_100.py
          python3 -u scripts/complete_rosewood_batch_091_100.py
      - name: Verify all ten assembled original comparisons and five deferred
        run: |
          python3 - <<'PY'
          import csv,json,zipfile
          from pathlib import Path
          p=Path("analysis/rosewood_furniture/2026-10-31/ten_batch_review/batch_091_100_v1")
          m=json.loads((p/"MANIFEST.json").read_text("utf8"))
          assert m["total_pz_styles"]==357
          assert m["total_batches"]==36
          assert m["batches_reviewed"]==10 and m["batches_unreviewed"]==26
          assert m["individual_items_checked_this_batch"]==10
          assert m["unique_decocraft_models_rerendered"]==30
          assert m["native_model_pz_comparison_cards"]==10
          assert m["conditional_match_proposals"]==5
          assert m["deferred_other_mod_or_vanilla_search"]==5
          assert m["exact_1_to_1_matches_certified"]==0
          a=list(csv.DictReader((p/"BATCH_091_100_MANUAL_VISUAL_REVIEW.csv").open(encoding="utf-8-sig")))
          assert [int(x["index"]) for x in a]==list(range(91,101))
          assert all(len(x["native_source_model_sha256"])==64 for x in a)
          assert all(x["approved_for_minecraft_world_replacement"]=="NO" for x in a)
          assert len(list((p/"cards").glob("*_PZ_vs_MC.jpg")))==10
          d=list(csv.DictReader((p/"BATCH_091_100_DEFERRED_OTHER_MODS.csv").open(encoding="utf-8-sig")))
          assert [int(x["index"]) for x in d]==[92,94,95,97,99]
          b=list(csv.DictReader((p/"BATCHES_ALL_357_PROGRESS.csv").open(encoding="utf-8-sig")))
          assert len(b)==36
          assert all(x["review_status"]=="COMPLETED_CONDITIONAL_CANDIDATES" for x in b[:10])
          assert all(x["review_status"]=="QUEUED_FOR_MANUAL_IMAGE_REVIEW" for x in b[10:])
          assert b[10]["range"]=="101-110"
          with zipfile.ZipFile(p/"ROSEWOOD_BATCH_091_100_MANUAL_REVIEW.zip") as z:
           assert z.testzip() is None
           assert "INDEX.html" in z.namelist()
          print("BATCH10_VALID",m)
          PY
      - name: Commit reviewed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/ten_batch_review/batch_091_100_v1/
          git commit -m "review(rosewood): tenth group 091-100 native model vs complete tile furniture, 4 deferred and progress 100/357"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
