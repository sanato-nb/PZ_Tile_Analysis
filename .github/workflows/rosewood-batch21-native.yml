name: Rosewood batch21 — native Blockbench candidate evidence 201-210
on:
  push:
    branches: [work/rosewood-manual-batch21-201-210-20261102]
    paths: [.github/workflows/rosewood-batch21-native.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/render_rosewood_batch21_native_candidates.py
            /scripts/render_rosewood_batch03_native_candidates.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_real_furniture_matches_v4/ROSEWOOD_357_PZ_TO_REAL_MINECRAFT_BLOCKSTATE_MATCH.csv
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/ALL_357_COMPLETE_FURNITURE_3D_CROSSWALK.csv
            /analysis/rosewood_furniture/2026-10-31/complete_furniture_visual_3d_v1/previews/
      - name: Download and SHA256 verify official Blockbench 5.2.2
        run: |
          mkdir -p /tmp/blockbench-app
          cd /tmp/blockbench-app
          curl -fsSL --retry 3 -o Blockbench_5.2.2.AppImage https://github.com/JannisX11/blockbench/releases/download/v5.2.2/Blockbench_5.2.2.AppImage
          echo '375fb8da33b8b9ad0f1f790836ed83020b6e987a56e23184d31d6ccf3132ac3b  Blockbench_5.2.2.AppImage' | sha256sum -c -
          chmod +x Blockbench_5.2.2.AppImage
          ./Blockbench_5.2.2.AppImage --appimage-extract >/dev/null
      - name: Install native desktop rendering dependencies
        run: |
          python3 -m pip install -q --break-system-packages pillow playwright numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgtk-3-0 libgbm1 libnss3 >/dev/null
      - name: Verify source JAR SHA512 and open 8 authored BBMODEL files
        run: python3 -u scripts/render_rosewood_batch21_native_candidates.py
      - name: Verify provenance and native screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('analysis/rosewood_furniture/2026-10-31/ten_batch_review/21_201_210/extra_decocraft_render')
          a=json.loads((p/'NATIVE_BLOCKBENCH_PROOF.json').read_text('utf8'))
          assert len(a)==8
          good=[r for r in a if r.get('loaded_verified') and r.get('native_model_screenshot') and (p/r['native_model_screenshot']).is_file()]
          assert len(good)>=5,[(r['id'],r.get('error')) for r in a]
          assert all(len(r['source_sha256'])==64 and len(r['variant_sha256'])==64 for r in good)
          print('BATCH21_NATIVE_SOURCE_OK',len(good),'of 8')
          PY
      - name: Commit original Blockbench evidence without changing other lanes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse analysis/rosewood_furniture/2026-10-31/ten_batch_review/21_201_210/extra_decocraft_render/
          git diff --cached --quiet && exit 0
          git commit -m 'render(rosewood): original Blockbench evidence 201-210'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
