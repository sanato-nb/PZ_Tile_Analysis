name: Diagnose custom Minecraft model geometry references
on:
  push:
    branches: [work/rosewood-furniture-visual-side-by-side-20261101]
    paths: [.github/workflows/rosewood-probe-model-loader.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/probe_rosewood_mc_model_resources.py
            /analysis/rosewood_furniture/2026-10-31/minecraft_actual_mod_registry_v2/MOD_VERSION_SOURCES.json
      - run: python3 scripts/probe_rosewood_mc_model_resources.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/rosewood_furniture/2026-10-31/visual_pz_vs_mc_357_v1/MODEL_DIAGNOSTICS.json
          git commit -m "analysis(rosewood): model loader metadata for real MC furniture image renderer"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
