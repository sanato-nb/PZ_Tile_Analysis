name: v91 132-tile visual review unified SQLite verification
on:
  push:
    branches: [work/v91-expanded-20261026]
    paths:
      - scripts/build_unified_v91.py
      - scripts/restore_unified_v91.py
      - scripts/build_v91_review_html.py
      - checkpoints/v91/observations_combined.tsv
      - checkpoints/v91/verify_combined.py
      - .github/workflows/build-unified-v91-expanded.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v90/*
            /scripts/*.py
            /checkpoints/v91/*
            /checkpoints/v91_preview/*
            /checkpoints/v91_extra_preview/*
            /PROJECT_STATE.json
            /docs/HANDOFF.md
            /.github/workflows/build-unified-v91-expanded.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Restore and verify v90 source database
        run: python3 scripts/restore_unified_v90.py "$RUNNER_TEMP/v90.sqlite"
      - name: Validate 132 unique independently inspected tiles and source PNG/TMX evidence
        run: python3 checkpoints/v91/verify_combined.py
      - name: Build v91 unified database preserving original tables
        run: python3 scripts/build_unified_v91.py "$RUNNER_TEMP/v90.sqlite"
      - name: Restore v91 compressed SQLite and verify counts
        run: python3 scripts/restore_unified_v91.py "$RUNNER_TEMP/v91_roundtrip.sqlite"
      - name: Produce split CSV, image embedded HTML and CRC ZIP
        run: python3 scripts/build_v91_review_html.py
      - name: Validate project and refresh handoff
        run: |
          python3 scripts/validate_project.py
          python3 scripts/generate_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-v91-unified-sqlite
          path: ${{ runner.temp }}/tile_visual_v91_unified.sqlite
          retention-days: 90
      - name: Commit verified v91 database and checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse analysis/current/v91/ checkpoints/v91/ PROJECT_STATE.json docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "검증: v91 132종 직접 판독 SQLite SHA·중복·CRC 및 데이터 계보 보존"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
