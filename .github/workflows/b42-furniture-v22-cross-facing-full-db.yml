name: B42 v22 source first paired facing comparison complete database
on:
  push:
    branches:
      - work/pz-b42-cross-facing-pair-review-v22-20261105
    paths:
      - scripts/build_b42_furniture_cross_facing_v22.py
      - analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_DIRECT_PAIRED_VISUAL_CLASSIFICATIONS.csv
      - .github/workflows/b42-furniture-v22-cross-facing-full-db.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analysis/furniture_full_b42/2026-11-04/multipart_grid_v21/B42_FURNITURE_MULTIPART_GRID_V21.zip
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/STAGING_MANIFEST.json
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIR_SELECTION_SOURCE_ONLY.csv
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_120_FACING_GRID_CANDIDATES.csv
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_SELECTED_ORIGINAL_PART_POSITIONS.csv
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_DIRECT_ORIGINAL_SOURCE_PIXEL_SHA256.csv
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_DIRECT_PAIRED_VISUAL_CLASSIFICATIONS.csv
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_01.png
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_02.png
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_03.png
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_04.png
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_05.png
            /analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_60_PAIRS_FACING_CONTACT_06.png
            /scripts/build_b42_furniture_cross_facing_v22.py
      - name: Build source-linked v22 SQLite for 60 direct visual pairs and 120 new facing grids
        run: |
          python3 -m py_compile scripts/build_b42_furniture_cross_facing_v22.py
          python3 -u scripts/build_b42_furniture_cross_facing_v22.py
      - name: Independent verify source evidence, no overlap, scoped progress and ZIP CRC
        run: |
          python3 - <<'PY'
          import sqlite3,csv,json,zipfile
          from pathlib import Path
          p=Path('analysis/furniture_full_b42/2026-11-05/cross_facing_v22')
          m=json.loads((p/'MANIFEST.json').read_text(encoding='utf8'))
          assert m['preserved_candidate_registry_rows']==2231
          assert m['new_distinct_source_groups_two_facing_direct_image_reviews']==60
          assert m['new_unique_group_facing_direct_image_reviews']==120
          assert m['new_real_source_sprite_crops_SHA256']==258
          assert m['cumulative_direct_multitile_group_direction_views']==200
          assert m['still_unreviewed_multitile_direction_candidates']==620
          assert m['certified_exact_runtime_game_object_ID']==0
          assert m['original_474_warnings_still_unresolved']
          assert sum(m['new_pair_visual_class_counts'].values())==60
          assert m['integrity_check']=='ok'
          with sqlite3.connect(p/'B42_FURNITURE_CROSS_FACING_REVIEW_V22.sqlite') as c:
            assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            for t,n in {'source_attributes':195265,'source_slots':73644,
              'registry_entry':2231,'furniture_tile':8219,
              'v13_warning_case':474,'v21_all_source_rectangle_template':843,
              'v21_source_tile_positioned_png':2221,
              'v21_direct_multisprite_grid_visual_observation':80,
              'v22_direct_two_facing_visual_comparison':60,
              'v22_new_facing_original_grid':120,
              'v22_original_sprite_pixel_sha':258,
              'v22_remaining_multitile_direction_queue':620,
              'v22_progress_scope':12}.items():
                assert c.execute('SELECT COUNT(*) FROM '+t).fetchone()[0]==n,t
            assert c.execute('SELECT COUNT(DISTINCT group_id) FROM v22_direct_two_facing_visual_comparison').fetchone()[0]==60
            assert c.execute('SELECT COUNT(*) FROM v22_direct_two_facing_visual_comparison WHERE runtime_object_ID_certified<>0').fetchone()[0]==0
            old=set(c.execute('SELECT group_id,Facing FROM v21_direct_multisprite_grid_visual_observation'))
            new=set(c.execute('SELECT group_id,Facing FROM v22_new_facing_original_grid'))
            assert len(old)==80 and len(new)==120 and not old.intersection(new)
            assert len(old|new)==200
          with zipfile.ZipFile(p/'B42_FURNITURE_CROSS_FACING_REVIEW_V22.zip') as z:
            assert z.testzip() is None
            assert 'B42_FURNITURE_CROSS_FACING_REVIEW_V22.sqlite' in z.namelist()
          with (p/'V22_620_STILL_UNREVIEWED_MULTITILE_FACING_QUEUE.csv').open(encoding='utf-8-sig') as f:
            assert sum(1 for _ in csv.reader(f))-1==620
          print('V22_60_SOURCE_PAIR_120_FACING_258_PNG_PIECE_ORIGINAL_SQLITE_CRC_COMPLETE')
          PY
      - name: Commit complete versioned source-linked SQLite ZIP and CSV evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            analysis/furniture_full_b42/2026-11-05/cross_facing_v22/V22_*.csv \
            analysis/furniture_full_b42/2026-11-05/cross_facing_v22/MANIFEST.json \
            analysis/furniture_full_b42/2026-11-05/cross_facing_v22/README_KO.md \
            analysis/furniture_full_b42/2026-11-05/cross_facing_v22/B42_FURNITURE_CROSS_FACING_REVIEW_V22.zip
          git commit -m 'db(b42): v22 60 visual facing pairs 120 new source grids with 258 original sprite hashes'
          git pull --rebase origin "$GITHUB_REF_NAME"
          for i in 1 2 3 4; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "retry GitHub transient upload $i"
            sleep 4
          done
          exit 1
