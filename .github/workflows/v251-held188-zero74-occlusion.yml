name: v251 74 single-use target occlusion causal GID trace
on:
  push:
    branches: [review/v251_held188_single_location_Afirst_20261030]
    paths:
      - scripts/v251_trace_74_zero_BC_causal.py
      - .github/workflows/v251-held188-zero74-occlusion.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_original_BC_zero_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v251_trace_74_zero_BC_causal.py
            /review/v251_held188_single_location_Afirst_2026-10-30/REAL_ORIGINAL_SINGLE_188_BC.csv
            /review/v117_A_candidates_10042/A_CANDIDATE_COMBINED_10042.csv
            /review/v117_A_candidates_10042/MANIFEST.json
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v238_integrated_master_2026-10-29/MASTER_HELD_439_SOURCE_VERIFIED.csv
      - run: python3 -m pip install --quiet Pillow --break-system-packages
      - name: Fetch only needed actual source TMX files
        run: |
          python3 scripts/v251_trace_74_zero_BC_causal.py --list-tmx > /tmp/tmx
          cat > /tmp/sparse <<'EOF'
          /scripts/v251_trace_74_zero_BC_causal.py
          /review/v251_held188_single_location_Afirst_2026-10-30/REAL_ORIGINAL_SINGLE_188_BC.csv
          /review/v117_A_candidates_10042/A_CANDIDATE_COMBINED_10042.csv
          /review/v117_A_candidates_10042/MANIFEST.json
          /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
          /review/v238_integrated_master_2026-10-29/MASTER_HELD_439_SOURCE_VERIFIED.csv
          EOF
          sed 's|^|/|' /tmp/tmx >> /tmp/sparse
          git sparse-checkout set --no-cone --stdin < /tmp/sparse
          wc -l /tmp/tmx
      - name: Fetch original PNG sources present in the genuine TMX neighbourhood
        run: |
          python3 scripts/v251_trace_74_zero_BC_causal.py --list-png > /tmp/png
          sed 's|^|/|' /tmp/png >> /tmp/sparse
          git sparse-checkout set --no-cone --stdin < /tmp/sparse
          wc -l /tmp/png
      - name: Pixel-level draw-order causal trace for zero-visibility keys
        run: python3 -u scripts/v251_trace_74_zero_BC_causal.py
      - name: Save audit without modifying previous raw records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v251_held188_single_location_Afirst_2026-10-30/occlusion74/
          if ! git diff --cached --quiet; then
            git commit -m "v251: 74 zero-delta original TMX drawn sprite causal events"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
