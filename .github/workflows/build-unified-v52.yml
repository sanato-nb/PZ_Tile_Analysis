name: Build physically unified v52 tile database
on:
  push:
    branches: [main]
    paths:
      - "checkpoints/v52/**"
      - "scripts/build_unified_v52.py"
      - "scripts/restore_unified_v52.py"
      - ".github/workflows/build-unified-v52.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preserved v51 archive and new v52 records
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /analysis/current/
            /analysis/imports/
            /scripts/
            /checkpoints/v52/
            /PROJECT_STATE.json
            /docs/HANDOFF.md
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Recover verified physical v51 database
        run: python3 scripts/restore_unified_v51.py "$RUNNER_TEMP/tile_visual_v51.sqlite"
      - name: Verify v52 review count and key uniqueness
        run: python3 checkpoints/v52/verify_delta.py
      - name: Build new physical v52 database without altering v51
        run: python3 scripts/build_unified_v52.py "$RUNNER_TEMP/tile_visual_v51.sqlite"
      - name: Roundtrip SHA-256 and SQLite integrity checks
        run: python3 scripts/restore_unified_v52.py "$RUNNER_TEMP/v52_roundtrip.sqlite"
      - name: Upload v52 actual SQLite (90-day Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-unified-v52-SQLite
          path: ${{ runner.temp }}/tile_visual_v52_unified.sqlite
          retention-days: 90
          if-no-files-found: error
      - name: Commit verified v52 SQLite shards, manifest, and state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/current/v52/ PROJECT_STATE.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified complete v52 integrated SQLite"
            git pull --rebase origin main
            git push
          fi
