name: v52 타일 통합 데이터베이스 생성 및 검증
on:
  push:
    branches: [main]
    paths:
      - "checkpoints/v52/**"
      - "scripts/build_unified_v52.py"
      - "scripts/restore_unified_v52.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: v51 보존 자료 및 신규 v52 기록 가져오기
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /analysis/current/
            /analysis/imports/
            /scripts/
            /checkpoints/v52/
            /PROJECT_STATE.json
            /docs/HANDOFF.md
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: 검증된 v51 통합 DB 복원
        run: python3 scripts/restore_unified_v51.py "$RUNNER_TEMP/tile_visual_v51.sqlite"
      - name: v52 신규 관찰 수 및 고유 키 검증
        run: python3 checkpoints/v52/verify_delta.py
      - name: v51 원본 보존 후 신규 v52 DB 생성
        run: python3 scripts/build_unified_v52.py "$RUNNER_TEMP/tile_visual_v51.sqlite"
      - name: 복원 파일 해시 및 SQLite 무결성 검사
        run: python3 scripts/restore_unified_v52.py "$RUNNER_TEMP/v52_roundtrip.sqlite"
      - name: v52 실제 SQLite 다운로드 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: PZ-B42-unified-v52-SQLite
          path: ${{ runner.temp }}/tile_visual_v52_unified.sqlite
          retention-days: 90
          if-no-files-found: error
      - name: 검증된 v52 DB와 진행도 GitHub에 저장
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/current/v52/ PROJECT_STATE.json
          if ! git diff --cached --quiet; then
            git commit -m "데이터: 검증된 v52 통합 SQLite와 진행 상태 저장"
            git pull --rebase origin main
            git push
          fi
