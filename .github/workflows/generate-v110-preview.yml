name: v110 strict real D A-B-C-D evidence for 32 unobserved keys
on:
  push:
    branches: [work/v110-strict-d-20261026]
    paths:
      - scripts/generate_v110_preview.py
      - .github/workflows/generate-v110-preview.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v108/*
            /audits/v110_remaining_D_scan.json
            /scripts/generate_v110_preview.py
            /scripts/restore_unified_v108.py
            /.github/workflows/generate-v110-preview.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Render actual A B C D evidence from original PNG and TMX
        run: python3 scripts/generate_v110_preview.py > "$RUNNER_TEMP/v110_preview.log"
      - name: Verify all 32 keys have distinct actual D and images
        run: |
          python3 - <<'PY'
          import json,pathlib
          from PIL import Image
          p=pathlib.Path('checkpoints/v110_preview')
          m=json.loads((p/'EVIDENCE_MANIFEST.json').read_text())
          rows=[r for r in m['results'] if r['status']=='evidence_only_unreviewed']
          assert m['base']=='v108' and m['observed_count_added']==0
          assert len(rows)==3 and len({tuple(r['key']) for r in rows})==3
          assert all(r['other_placement_available'] for r in rows)
          assert all((r['primary_placement']['tmx'],r['primary_placement']['level'],r['primary_placement']['x'],r['primary_placement']['y']) != (r['other_placement']['tmx'],r['other_placement']['level'],r['other_placement']['x'],r['other_placement']['y']) for r in rows)
          assert len(m['review_sheets'])==1
          for r in rows:
            for k in ('A','B','C','D','board'):
              with Image.open(p/r[k]) as im: im.verify()
          for f in m['review_sheets']:
            with Image.open(f) as im: im.verify()
          print('PASS v110 3 unique genuine D keys, 15 JPEG, 1 sheet, no observations counted')
          PY
      - name: Commit evidence-only images for independent direct visual inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse checkpoints/v110_preview/
          if ! git diff --cached --quiet; then
            git commit -m "증거(v110): 중복 없는 미관찰 32종 실제 다른 TMX D 포함 A-B-C-D 이미지 생성 (미판독)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
