name: v110 evidence-only 9 crop-valid tiles from v109 queue
on:
  push:
    branches: [work/v110-visual-20261026]
    paths:
      - scripts/generate_v110_preview.py
      - .github/workflows/generate-v110-preview.yml
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Tiles/2x/*
            /B4220.3_MapExport_256/tmx/31_45.tmx
            /B4220.3_MapExport_256/tmx/31_46.tmx
            /analysis/current/v109/*
            /scripts/generate_v110_preview.py
            /scripts/restore_unified_v109.py
            /.github/workflows/generate-v110-preview.yml
      - run: python3 -m pip install --quiet Pillow
      - name: Generate images from v109 genuine unobserved queue (no identity claims)
        run: python3 scripts/generate_v110_preview.py > "$RUNNER_TEMP/v110_preview.log"
      - name: Validate A B C D images and queue uniqueness
        run: |
          python3 - <<'PY'
          import json, pathlib
          from PIL import Image
          p=pathlib.Path('checkpoints/v110_preview')
          m=json.loads((p/'EVIDENCE_MANIFEST.json').read_text())
          rows=[r for r in m['results'] if r['status']=='evidence_only_unreviewed']
          assert m['base']=='v109' and m['observed_count_added']==0
          assert len(rows)==9 and len({tuple(r['key']) for r in rows})==9
          assert all(r['primary_placement']['gid'] and r['visible_pixel_delta']>=0 for r in rows)
          assert len(m['review_sheets'])==2
          assert len(m['blocked_unobserved'])==m['blocked_count']==42
          assert len({tuple(z['key']) for z in m['blocked_unobserved']})==42
          assert not ({tuple(z['key']) for z in m['blocked_unobserved']} & {tuple(r['key']) for r in rows})
          for r in rows:
            for k in ('A','B','C','D','board'):
              with Image.open(p/r[k]) as im: im.verify()
          for f in m['review_sheets']:
            with Image.open(f) as im: im.verify()
          print('PASS v110 EVIDENCE ONLY 9 KEYS, 45 JPEG, 2 SHEETS; 42 BLOCKED; OBSERVED ADD 0')
          PY
      - name: Commit evidence-only images, pending direct visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse checkpoints/v110_preview/
          if ! git diff --cached --quiet; then
            git commit -m "증거(v110): 크롭 가능 9종 원본 PNG/TMX A-B-C-D 이미지·접촉판 생성 (미판독)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
