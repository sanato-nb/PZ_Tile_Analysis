      - run: python3 -m pip install --quiet Pillow
      - name: Reproduce v120 B bytes then remove exact single target GID for C
        run: python3 -u scripts/v121_generate_C_diff_new4632.py
      - name: Validate all 4632 lossless C and exact image-difference PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,hashlib,zipfile,io
          from PIL import Image
          R=Path('review/v121_C_diff_new4632')
          m=json.loads((R/'MANIFEST.json').read_text('utf8'))
          assert m['target_new_4632']==m['processed_4632']==m['exact_one_layer_one_cell_GID_removed']==4632
          assert m['B_byte_exact_regenerated_and_SHA_matches']==4632
          assert m['nonzero_B_minus_C']+m['zero_B_minus_C']==4632
          assert m['official_mapping_verified']==m['identity_certified']==0
          assert m['contact_sheets']==58 and len(m['C_archives'])==12 and len(m['DIFF_archives'])==12
          with (R/'C_B_DIFFERENCE_4632.csv').open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==4632 and len({(r['tile_set_name'],r['local_id']) for r in rows})==4632
          assert sum(r['B_minus_C_nonzero']=='1' for r in rows)==m['nonzero_B_minus_C']
          assert sum(int(r['removed_exactly_one_raw_gid']) for r in rows)==4632
          assert all(r['mapping_verified']=='0' and r['tilezed_verified']=='0' and r['identity_final_certified']=='0' for r in rows)
          hashes={}
          for a in m['C_archives']+m['DIFF_archives']:
            p=Path(a['path'])
            assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None and len(z.namelist())==a['entries']
              for name in z.namelist():
                buf=z.read(name); hashes[(str(p.relative_to(R)),name)]=hashlib.sha256(buf).hexdigest()
                with Image.open(io.BytesIO(buf)) as im:
                  assert im.size==(800,580)
                  im.verify()
          assert len(hashes)==9264
          for r in rows:
            assert hashes[(r['C_zip_shard'],r['C_zip_entry'])]==r['C_webp_file_sha256']
            assert hashes[(r['DIFF_zip_shard'],r['DIFF_zip_entry'])]==r['DIFF_png_file_sha256']
          sheets=list((R/'sheets').glob('C_B_DIFF_*.jpg'))
          assert len(sheets)==58
          for path in sheets:
            with Image.open(path) as im:
              assert im.size==(3600,2050)
              im.verify()
          assert hashlib.sha256((R/'C_B_DIFFERENCE_4632.csv').read_bytes()).hexdigest()==m['output_CSV_sha256']
          print('PASS C 4632 exact layer-one tile removals; B bytes reproduced; exact B-C diff before compression, 24 ZIP CRC PASS',m['nonzero_B_minus_C'],m['zero_B_minus_C'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v121-C-B-DIFF-new4632
          path: review/v121_C_diff_new4632/
          compression-level: 0
          retention-days: 90
      - name: Commit v121 lossless C and diff scenes, source ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v121_C_diff_new4632/
          if ! git diff --cached --quiet; then
            git commit -m "v121: C exact one-GID removed at original TMX layer with lossless B-C diff, 4632 new keys"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
