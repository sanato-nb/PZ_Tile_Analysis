      - run: python3 -m pip install --quiet Pillow
      - name: Generate actual A/B/C/D scenes and extend v122 SQLite immutably
        run: python3 -u scripts/v123_build_abcd_next160.py
      - name: Verify evidence ZIP, HTML, database, preserved catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,csv,hashlib,zipfile,sqlite3,zlib,base64
          v=Path('review/v123_ABCD_next160')
          a=json.loads((v/'MANIFEST.json').read_text())
          d=json.loads(Path('analysis/current/v123/MANIFEST.json').read_text())
          assert a['new_keys_for_abcd']==160 and a['ledger_index_begin']==160 and a['ledger_index_end']==319
          assert a['mapping_verified']==a['tilezed_verified']==a['final_certified']==0
          assert hashlib.sha256((v/'ABCD_160_319.csv').read_bytes()).hexdigest()==a['evidence_csv_sha256']
          with (v/'ABCD_160_319.csv').open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==160 and len({(r['tile_set_name'],r['local_id']) for r in rows})==160
          assert all(r['target_removed_exactly_one']=='1' for r in rows)
          with zipfile.ZipFile(v/'ABCD_160_319_evidence.zip') as z:assert z.testzip() is None
          assert d['old_catalog']==5409 and d['old_observed']==5400 and d['parent']=='v122'
          blob=zlib.decompress(base64.b64decode(''.join(Path(p).read_text() for p in d['parts'])))
          assert hashlib.sha256(blob).hexdigest()==d['sqlite_sha256']
          p=Path('/tmp/v123_verify.sqlite');p.write_bytes(blob)
          with sqlite3.connect(p) as c:
            assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert c.execute('SELECT count(*) FROM v123_abcd_evidence_next160').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM v122_ai_visual_review_160').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM v121_abcd_evidence').fetchone()[0]==160
            assert c.execute('SELECT count(*) FROM v116_user_excluded_missing_image').fetchone()[0]==6
            assert c.execute('SELECT count(*) FROM v113_user_review').fetchone()[0]>=9
          print('PASS v123 pixel evidence and full historical SQLite')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v123-new160-ABCD-integrity
          path: |
            review/v123_ABCD_next160/
            analysis/current/v123/
          retention-days: 90
          compression-level: 0
      - name: Commit newly generated evidence only
