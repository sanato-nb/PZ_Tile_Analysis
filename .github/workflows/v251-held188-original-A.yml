name: v251 exact 188 held single-location original A audit
on:
  push:
    branches: [review/v251_held188_single_location_Afirst_20261030]
    paths:
      - scripts/v251_verify_and_contact_original_A_188.py
      - .github/workflows/v251-held188-original-A.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_original_A:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v251_verify_and_contact_original_A_188.py
            /review/v246_held439_real_alt_TMX_2026-10-30/HELD439_ALTERNATE_SITE_CENSUS.csv
            /review/v246_held439_real_alt_TMX_2026-10-30/ALL_HELD_REAL_TMX_OCCURRENCES.csv
            /review/v245_held439_complete_A_png_sha_2026-10-30/HELD_439_ORIGINAL_A_RGBA_VERIFIED.csv
            /review/v119_selected_A_new4633/MANIFEST.json
            /review/v119_selected_A_new4633/REPRESENTATIVE_A_4633.csv
            /review/v119_selected_A_new4633/selected_png_shards/*
            /review/v251_held188_single_location_Afirst_2026-10-30/*
      - run: python3 -m pip install --quiet Pillow --break-system-packages
      - name: Verify exact original A 188 source PNG and RGBA, render alpha-aware source contacts
        run: python3 -u scripts/v251_verify_and_contact_original_A_188.py
      - name: Append evidence without touching old state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v251_held188_single_location_Afirst_2026-10-30/
          if ! git diff --cached --quiet; then
            git commit -m "v251: 188 exact A source RGBA, SHA and twelve visual review sheets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
