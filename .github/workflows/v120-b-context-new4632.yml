      - name: Install image renderer
        run: python3 -m pip install --quiet Pillow
      - name: Read 84 source TMX and render actual 4632 B scenes
        run: python3 -u scripts/v120_generate_B_context_4632.py
      - name: Independently verify CSV coordinates and all source image ZIPs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import csv,json,zipfile,hashlib,io
          R=Path('review/v120_B_context_new4632')
          m=json.loads((R/'MANIFEST.json').read_text('utf8'))
          assert m['B_actual_tmx_placement_indexed']==m['B_5x5_rendered']==4632
          assert m['remaining_new_without_A']==1
          assert m['prior_existing_target_images_regenerated']==0
          assert m['source_tile_scope_10042']==10042 and len(m['source_TMX_sha256'])==84
          assert m['B_contact_sheet_count']==58 and len(m['B_image_zip_shards'])==12
          assert m['official_mapping_verified']==m['identity_certified']==m['AI_scene_visually_verified_all']==0
          with (R/'B_CONTEXT_4632.csv').open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==4632 and len({(r['tile_set_name'],r['local_id']) for r in rows})==4632
          with (R/'PLACEMENTS_4632.csv').open(encoding='utf-8-sig',newline='') as f:places=list(csv.DictReader(f))
          assert len(places)==4632
          assert {(r['tile_set_name'],r['local_id']) for r in rows}=={(r['tile_set_name'],r['local_id']) for r in places}
          assert all(r['B_zip_shard'] and r['B_zip_entry'] and r['source_layer_index'] for r in rows)
          assert all(int(r['source_occurrence_count_84_maps'])>=1 for r in rows)
          assert all(r['scene_window']=='5x5' and r['scene_status']=='rendered_approximate' for r in rows)
          shas={}
          for a in m['B_image_zip_shards']:
            p=R/'b_png_shards'/a['file']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None and len(z.namelist())==a['entries']
              for name in z.namelist():
                raw=z.read(name)
                shas[(str(p.relative_to(R)),name)]=hashlib.sha256(raw).hexdigest()
                with Image.open(io.BytesIO(raw)) as im: assert im.size==(800,580);im.verify()
          assert len(shas)==4632
          for r in rows:assert shas[(r['B_zip_shard'],r['B_zip_entry'])]==r['B_webp_file_sha256']
          for p in (R/'sheets').glob('B_5x5_*.jpg'):
            with Image.open(p) as im:im.verify()
          assert len(list((R/'sheets').glob('B_5x5_*.jpg')))==58
          print('PASS B 4632 true TMX placements, 4632 visual scenes, 12 CRC PNG shards, no certified mapping')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v120-B-scene-new4632
          path: review/v120_B_context_new4632/
          compression-level: 0
          retention-days: 90
      - name: Commit auditable B 4632 actual scenes and full source ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v120_B_context_new4632/
          if ! git diff --cached --quiet; then
            git commit -m "v120 B: original TMX 5x5 context scenes for 4632 new keys with SHA, source coordinates, ZIP CRC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
