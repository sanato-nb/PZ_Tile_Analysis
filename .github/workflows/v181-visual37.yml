name: v181 56 actual alternate A B C images manually inspected, 37 original-source proven provisional keys
on:
  push:
    branches: [work/v181-multisite-visual37-20261028]
    paths:
      - scripts/v181_from_multisite37.py
      - scripts/v181_finalize_checkpoint.py
      - .github/workflows/v181-visual37.yml
permissions:
  contents: write
concurrency:
  group: v181-visual37-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v181_from_multisite37.py
            /scripts/v181_finalize_checkpoint.py
            /PROJECT_STATE.json
            /AGENTS.md
            /docs/HANDOFF.md
            /analysis/current/v180/*
            /review/v180_remnant239_multisite/ALTERNATE_MULTISITE_IMAGES.zip
            /review/v180_remnant239_multisite/ALTERNATE_SELECTED_SCENES.csv
            /review/v180_remnant239_multisite/MANIFEST.json
            /review/v181_multisite_visual37/MANUAL_VISUAL_NOTES.json
            /B4220.3_MapExport_256/tmx/*
      - run: python3 -m pip install --quiet Pillow
      - name: Compare all 56 original A B C PNG, CRC, raw GIDs and append only 37 human-seen provisional keys
        run: python3 -u scripts/v181_from_multisite37.py
      - name: Independent exact parent 242-table record validation and visual-source integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,csv,sqlite3,base64,zlib,zipfile
          R=Path('review/v181_multisite_visual37')
          m=json.loads((R/'MANIFEST.json').read_text())
          p=json.loads(Path('analysis/current/v180/MANIFEST.json').read_text())
          d=json.loads(Path('analysis/current/v181/MANIFEST.json').read_text())
          assert m['original_alt_scenes_manually_reviewed']==56 and m['B_C_positive']==47
          assert m['provisional_accepted']==37 and m['excluded']==19
          assert m['weak_delta_held']==9 and m['neighbor_missing_held']==1 and m['zero_delta_held']==9
          assert m['observed_parent']==9792 and m['observed_now']==9829
          assert m['checkpoint_missing_after']==213 and m['physical_missing_after']==211 and m['historical_discrepancy']==2
          assert m['official_mapping_verified']==m['tilezed_verified']==m['final_certified']==0
          assert d['version']=='v181' and d['parent']=='v180'
          assert d['parent_sqlite_sha256']==p['sqlite_sha256'] and d['table_count']==243 and d['prior_tables_preserved']==242
          assert d['new_rows']==d['new_observed_rows']==37
          with (R/'VISUAL_REVIEW_37.csv').open(encoding='utf-8-sig') as f:rows=list(csv.DictReader(f))
          with (R/'EXCLUDED_19.csv').open(encoding='utf-8-sig') as f:exc=list(csv.DictReader(f))
          assert len(rows)==37 and len(exc)==19
          assert len({(x['tile_set_name'],x['local_id']) for x in rows})==37
          assert all(int(x['B_C_changed_pixels'])>=100 for x in rows)
          assert all(x['review_status']=='provisional_candidate' and x['certified']==x['mapping_verified']==x['tilezed_verified']=='0' for x in rows)
          assert hashlib.sha256((R/'VISUAL_REVIEW_37.csv').read_bytes()).hexdigest()==m['visual_csv_sha256']
          assert hashlib.sha256((R/'EXCLUDED_19.csv').read_bytes()).hexdigest()==m['exceptions_sha256']
          proof=Path(m['source_original_png_B_C_evidence'])
          assert hashlib.sha256(proof.read_bytes()).hexdigest()==m['source_evidence_zip_sha256']
          with zipfile.ZipFile(proof) as zz:assert zz.testzip() is None and len(zz.namelist())==56*4
          def load(m):
           z=base64.b64decode(''.join(Path(x).read_text('ascii').strip() for x in m['parts']),validate=True)
           assert hashlib.sha256(z).hexdigest()==m['compressed_sha256']
           raw=zlib.decompress(z)
           assert hashlib.sha256(raw).hexdigest()==m['sqlite_sha256'] and len(raw)==m['sqlite_bytes']
           return raw
          old=sqlite3.connect(':memory:');old.deserialize(load(p))
          new=sqlite3.connect(':memory:');new.deserialize(load(d))
          assert old.execute('PRAGMA integrity_check').fetchone()[0]=='ok' and new.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          a={r[0]:old.execute('SELECT COUNT(*) FROM "'+r[0]+'"').fetchone()[0] for r in old.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          b={r[0]:new.execute('SELECT COUNT(*) FROM "'+r[0]+'"').fetchone()[0] for r in new.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert len(a)==242 and len(b)==243
          assert set(b)-set(a)=={'v181_visual_review'} and b['v181_visual_review']==37
          for table,count in a.items():
           assert b[table]==count
           x=old.execute('SELECT * FROM "'+table+'"');y=new.execute('SELECT * FROM "'+table+'"')
           while True:
            c=x.fetchmany(1024);e=y.fetchmany(1024)
            assert c==e,('parent_table_modified',table)
            if not c:break
          assert new.execute('SELECT SUM(mapping_verified),SUM(tilezed_verified),SUM(certified) FROM v181_visual_review').fetchone()==(0,0,0)
          print('PASS v181 37 additional source-verified provisional tile descriptions, 243 physical SQLite tables preserved')
          PY
      - name: Commit latest checkpoint only after independent raw source/DB validation
        run: python3 -u scripts/v181_finalize_checkpoint.py
      - name: Persist verified CSV notes and 243-table SQLite physical database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v181_multisite_visual37 analysis/current/v181 PROJECT_STATE.json AGENTS.md docs/HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "v181 37 verified human-read A/B/C provisional tile part observations, 243 SQLite tables"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
