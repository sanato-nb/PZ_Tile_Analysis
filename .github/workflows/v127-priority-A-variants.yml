name: v127 focus on three different-source A candidates
on:
  push:
    branches: [work/v127-D-full-A-candidates-4633-20261027]
    paths:
      - scripts/v127_extract_priority_variants.py
      - .github/workflows/v127-priority-A-variants.yml
permissions:
  contents: write
jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/v127_extract_priority_variants.py
            /review/v127_D_A_candidates_full4633/D_CANDIDATE_LEDGER_4633.csv
            /review/v127_D_A_candidates_full4633/D_ALL_CANDIDATE_TRIALS.csv
            /Tiles/*
      - run: python3 -m pip install --quiet Pillow
      - name: View the 3 genuine alternate source PNG candidates
        run: python3 -u scripts/v127_extract_priority_variants.py
      - name: Validate audit original/variant file hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('review/v127_D_A_candidates_full4633/PRIORITY_VARIANTS_3.json')
          m=json.loads(p.read_text())
          assert m['candidate_variant_count']==3 and len(m['variant_tile_keys'])==3
          assert len(m['no_other_visible_alternative'])==1
          assert len(m['original_PNG_missing'])==1
          assert all(q['status'].endswith('not_mapping_certified') for q in m['variant_tile_keys'])
          assert m['mapping_verified']==m['tilezed_verified']==m['final_certified']==0
          assert hashlib.sha256(Path(m['comparison_image']).read_bytes()).hexdigest()==m['comparison_image_sha256']
          print('PASS source-variant image pixels')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PZ-v127-priority-3-source-variants
          path: |
            review/v127_D_A_candidates_full4633/PRIORITY_VARIANTS_3.json
            review/v127_D_A_candidates_full4633/PRIORITY_VARIANTS_3.md
            review/v127_D_A_candidates_full4633/D_EXACT_BASENAME_VARIANTS_3.jpg
          retention-days: 90
      - name: Commit supplemental evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v127_D_A_candidates_full4633/PRIORITY_VARIANTS_3.json review/v127_D_A_candidates_full4633/PRIORITY_VARIANTS_3.md review/v127_D_A_candidates_full4633/D_EXACT_BASENAME_VARIANTS_3.jpg
          if ! git diff --cached --quiet; then
            git commit -m "v127: 3 source variant A hypotheses separate from 30249 unrelated grid probes"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
