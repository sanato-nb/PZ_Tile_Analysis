      - run: python3 -m pip install --quiet Pillow
      - name: Read original sprites and 84 TMX, compare ABCD, preserve v132 DB
        run: python3 -u scripts/v133_visual_review_32.py
      - name: Independently recheck v133 artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zlib,base64,sqlite3,csv,zipfile
          p=Path('review/v133_visual32');x=json.loads((p/'MANIFEST.json').read_text())
          assert x['processed']==32 and x['observed_provisional']==32
          assert x['certified']==x['mapping_verified']==x['tilezed_verified']==0
          for path,hexdigest in x['files_sha256'].items():assert hashlib.sha256((p/path).read_bytes()).hexdigest()==hexdigest
          with zipfile.ZipFile(p/'ABC_D_32_PROOF.zip') as z:assert z.testzip() is None and len(z.namelist())==160
          with (p/'VISUAL_REVIEW_32.csv').open(encoding='utf-8-sig') as fp:recs=list(csv.DictReader(fp))
          assert len(recs)==32 and len({(r['tile_set_name'],r['local_id']) for r in recs})==32
          assert all(r['mapping_verified']==r['tilezed_verified']==r['certified']=='0' for r in recs)
          m=json.loads(Path('analysis/current/v133/MANIFEST.json').read_text())
          rawcomp=base64.b64decode(''.join(Path(part).read_text('ascii') for part in m['parts']),validate=True)
          assert hashlib.sha256(rawcomp).hexdigest()==m['compressed_sha256']
          raw=zlib.decompress(rawcomp)
          assert hashlib.sha256(raw).hexdigest()==m['sqlite_sha256'] and len(raw)==m['sqlite_bytes']
          con=sqlite3.connect(':memory:');con.deserialize(raw)
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]==195
          assert con.execute('SELECT count(*) FROM tile_catalog').fetchone()[0]==5409
          assert con.execute('SELECT count(*) FROM v132_visual3_jumbo20').fetchone()[0]==23
          assert con.execute('SELECT count(*) FROM v133_visual_review_32').fetchone()[0]==32
          assert con.execute('SELECT count(*) FROM v133_visual_review_32 WHERE certified!=0 OR tilezed_verified!=0 OR mapping_verified!=0').fetchone()[0]==0
          print('PASS v133 audit and 195 SQLite tables',m['sqlite_sha256'])
          PY
      - name: Commit v133 visual evidence and DB only on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse review/v133_visual32 analysis/current/v133
          if ! git diff --cached --quiet; then
            git commit -m "v133: 32 provisional ABCD observations and preserved 195-table physical DB"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
